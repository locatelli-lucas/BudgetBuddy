spring:
  datasource:
    url: jdbc:h2:mem:budgetbuddy;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;NON_KEYWORDS=MONTH,YEAR;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driverClassName: org.h2.Driver
    username: sa
    password: password
  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        trace: false
        web-allow-others: false
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  # Disable Redis in local dev (no Docker needed)
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 100ms
  cache:
    type: simple

  mail:
    host: localhost
    port: 1025
    username: dev
    password: dev

jwt:
  secret: averylongsecretkeyforlocaldevelopmentonlythatisatleast256bitslong1234567890

logging:
  level:
    com.budgetbuddy: DEBUG
    org.springframework.web: INFO
    org.hibernate.SQL: DEBUG
