spring:
  application:
    name: budgetbuddy-api
  config:
    import:
      - optional:file:.env
      - optional:file:api/.env

  datasource:
    url: ${DATABASE_URL:jdbc:h2:mem:budgetbuddy;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;NON_KEYWORDS=MONTH,YEAR;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
    username: ${DATABASE_USER:sa}
    password: ${DATABASE_PASSWORD:password}
    driver-class-name: org.h2.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2000ms

  cache:
    type: simple

  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:dev}
    password: ${MAIL_PASSWORD:dev}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true

  jackson:
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null

server:
  port: 8080
  error:
    include-message: always

# ─── JWT ──────────────────────────────────────────────────────────────────────
jwt:
  secret: averylongsecretkeyforlocaldevelopmentonlythatisatleast256bitslong1234567890
  access-expiry-ms: 900000        # 15 minutes
  refresh-expiry-ms: 2592000000   # 30 days

# ─── AI ───────────────────────────────────────────────────────────────────────
ai:
  provider: ${AI_PROVIDER:groq}
  groq:
    api-key: ${GROQ_API_KEY:}
    model: ${GROQ_MODEL:llama-3.3-70b-versatile}
    base-url: https://api.groq.com/openai/v1
  max-tokens: 2048

# ─── Firebase ─────────────────────────────────────────────────────────────────
firebase:
  credentials-path: ${FIREBASE_CREDENTIALS_PATH:firebase-credentials.json}
  project-id: ${FIREBASE_PROJECT_ID:}

# ─── External APIs ────────────────────────────────────────────────────────────
news:
  api-key: ${NEWS_API_KEY:}
  base-url: https://newsapi.org/v2

currency:
  base-url: https://economia.awesomeapi.com.br

finance:
  yahoo-base-url: https://query1.finance.yahoo.com

# ─── App ──────────────────────────────────────────────────────────────────────
app:
  base-url: ${APP_BASE_URL:http://localhost:8080}
  frontend-url: ${APP_FRONTEND_URL:http://localhost:3000}
  mail-from: ${MAIL_FROM:noreply@budgetbuddy.app}
  google:
    client-id: ${GOOGLE_CLIENT_ID:YOUR_GOOGLE_CLIENT_ID}
  security:
    encryption-key: ${ENCRYPTION_KEY:BudgetBuddyDefaultKey123456789012}

# ─── Actuator ─────────────────────────────────────────────────────────────────
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

# ─── Logging ──────────────────────────────────────────────────────────────────
logging:
  level:
    com.budgetbuddy: INFO
    org.springframework.security: WARN
