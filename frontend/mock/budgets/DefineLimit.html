    <style>
        /* Custom styles for range slider to match fintech aesthetic */
        input[type=range]::-webkit-slider-thumb {

            background: #b4c5ff;

            margin-top: -8px;

        }

        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 8px;
            cursor: pointer;
            background: #32343d;
            /* surface-variant */

        }

        /* Focus state for slider */

<body
    class="text-on-background antialiased min-h-screen flex flex-col font-body-md selection:bg-primary-container selection:text-on-primary-container bg-surface">

        </button>
    </nav>
    <script>
        // Simple JS for slider interaction visualization
        const slider = document.getElementById('limit-slider');
        const input = document.getElementById('limit-input');

        slider.addEventListener('input', (e) => {
            // Very basic visualization update
            let val = parseInt(e.target.value);
            input.value = val.toLocaleString('pt-BR', { minimumFractionDigits: 2 });
        });

        input.addEventListener('blur', (e) => {
            // Basic parse and update slider (simplified for prototype)
            let valStr = e.target.value.replace(/\./g, '').replace(',', '.');
            let val = parseFloat(valStr);
            if (!isNaN(val)) {
                slider.value = Math.min(Math.max(val, 100), 1000);
            }
        })
    </script>
