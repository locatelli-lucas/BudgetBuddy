    <!-- Suppressed BottomNavBar: The prompt indicates this is a sub-flow ("opened when clicking the 'more' icon in the category creation flow"), not a top-level destination. -->
    <script>
        // Simple script to handle chip selection for visual feedback
        document.addEventListener('DOMContentLoaded', () => {
            const chips = document.querySelectorAll('.overflow-x-auto button');
            chips.forEach(chip => {
                chip.addEventListener('click', () => {
                    // Reset all chips
                    chips.forEach(c => {
                        c.className = 'snap-start shrink-0 px-4 py-2 bg-surface-container text-on-surface hover:bg-surface-container-high rounded-full font-label-md text-label-md transition-colors border border-outline-variant/30';
                    });
                    // Set active chip
                    chip.className = 'snap-start shrink-0 px-4 py-2 bg-primary-container text-on-primary-container rounded-full font-label-md text-label-md transition-colors shadow-sm';
                });
            });
        });
    </script>
