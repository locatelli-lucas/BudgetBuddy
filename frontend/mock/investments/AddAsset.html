<!DOCTYPE html>
<html class="dark" lang="pt-BR" style="">

<head>
    <meta charset="utf-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>BudgetBuddy - Adicionar Ativo</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
        rel="stylesheet">
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
        rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }

        /* Custom scrollbar for cleaner look */
        ::-webkit-scrollbar {
            width: 4px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: #32343d;
            border-radius: 10px;
        }

        /* Glassmorphism subtle effect */
        .glass-card {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
    </style>
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-tertiary-fixed": "#360f00",
                        "error": "#ffb4ab",
                        "on-primary-fixed-variant": "#003ea8",
                        "surface": "#11131b",
                        "primary-fixed-dim": "#b4c5ff",
                        "on-secondary": "#233144",
                        "secondary-fixed": "#d5e3fd",
                        "on-error": "#690005",
                        "on-primary-container": "#eeefff",
                        "primary": "#b4c5ff",
                        "on-primary": "#002a78",
                        "outline-variant": "#434655",
                        "on-secondary-container": "#abb9d2",
                        "surface-container-high": "#282a32",
                        "tertiary-fixed-dim": "#ffb596",
                        "tertiary-fixed": "#ffdbcd",
                        "secondary-container": "#3c4a5e",
                        "inverse-on-surface": "#2e3039",
                        "on-secondary-fixed": "#0d1c2f",
                        "primary-container": "#2563eb",
                        "surface-container-lowest": "#0c0e16",
                        "surface-container-highest": "#32343d",
                        "on-primary-fixed": "#00174b",
                        "surface-variant": "#32343d",
                        "on-background": "#e1e2ed",
                        "on-tertiary-fixed-variant": "#7d2d00",
                        "inverse-surface": "#e1e2ed",
                        "surface-dim": "#11131b",
                        "background": "#11131b",
                        "surface-bright": "#373942",
                        "on-tertiary-container": "#ffede6",
                        "inverse-primary": "#0053db",
                        "tertiary": "#ffb596",
                        "on-error-container": "#ffdad6",
                        "error-container": "#93000a",
                        "secondary": "#b9c7e0",
                        "secondary-fixed-dim": "#b9c7e0",
                        "outline": "#8d90a0",
                        "tertiary-container": "#bc4800",
                        "primary-fixed": "#dbe1ff",
                        "on-surface-variant": "#c3c6d7",
                        "on-secondary-fixed-variant": "#3a485c",
                        "surface-tint": "#b4c5ff",
                        "on-surface": "#e1e2ed",
                        "surface-container": "#1d1f27",
                        "surface-container-low": "#191b23",
                        "on-tertiary": "#581e00"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "section-gap": "40px",
                        "stack-lg": "24px",
                        "gutter": "16px",
                        "stack-sm": "8px",
                        "stack-md": "16px",
                        "base": "8px",
                        "container-padding-mobile": "20px",
                        "container-padding-desktop": "32px"
                    },
                    "fontFamily": {
                        "headline-lg-mobile": ["Inter"],
                        "display": ["Inter"],
                        "body-md": ["Inter"],
                        "label-sm": ["Inter"],
                        "numeric-display": ["Inter"],
                        "label-md": ["Inter"],
                        "body-lg": ["Inter"],
                        "headline-md": ["Inter"],
                        "headline-lg": ["Inter"]
                    },
                    "fontSize": {
                        "headline-lg-mobile": ["24px", { "lineHeight": "32px", "fontWeight": "600" }],
                        "display": ["40px", { "lineHeight": "48px", "letterSpacing": "-0.02em", "fontWeight": "600" }],
                        "body-md": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "label-sm": ["12px", { "lineHeight": "16px", "letterSpacing": "0.02em", "fontWeight": "500" }],
                        "numeric-display": ["36px", { "lineHeight": "44px", "letterSpacing": "-0.02em", "fontWeight": "500" }],
                        "label-md": ["14px", { "lineHeight": "20px", "letterSpacing": "0.01em", "fontWeight": "500" }],
                        "body-lg": ["18px", { "lineHeight": "28px", "fontWeight": "400" }],
                        "headline-md": ["24px", { "lineHeight": "32px", "fontWeight": "600" }],
                        "headline-lg": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.01em", "fontWeight": "600" }]
                    }
                },
            },
        }
    </script>
</head>

<body class="bg-background text-on-surface min-h-screen pb-24">
    <!-- TopAppBar -->
    <header
        class="fixed top-0 w-full bg-surface z-50 flex justify-between items-center px-container-padding-mobile h-16 w-full">
        <button
            class="flex items-center justify-center p-2 rounded-full hover:bg-surface-container-high transition-colors active:scale-95">
            <span class="material-symbols-outlined text-primary" data-icon="arrow_back">arrow_back</span>
        </button>
        <h1 class="font-headline-md text-headline-md-mobile font-bold text-primary">Adicionar Ativo</h1>
        <div
            class="w-10 h-10 rounded-full bg-surface-container-highest flex items-center justify-center overflow-hidden border border-outline-variant">
            <img alt="User profile" class="w-full h-full object-cover"
                src="https://lh3.googleusercontent.com/aida-public/AB6AXuBL_isvTFS2l6Et0RAfWgI7cVCeqsTDsVzz18ELMpR8M-TbpagfTW9PWGuyo9KPJyrclGEjsV21ursR7uu3I7cMXC8FjpKRDib1VEVuEfHdWJqaZVIUOYc779VwoKUWl5Z4xGeimWapVGn1ayUSP0SLAvUiPBTucdZJ_bx7JBZFXCYwOtU5EHMCD-KBBPyphe1m_qnxns5XREtv5iFdCe5nLVvPFW1QG3M8UZB_ubnoGCHwonKTRheeIJdFk6L6F_hmgxUQx_aANZQ">
        </div>
    </header>
    <main class="pt-20 px-container-padding-mobile space-y-stack-lg max-w-2xl mx-auto">
        <!-- Value Input Section -->
        <section class="text-center py-stack-lg space-y-stack-sm">
            <label class="font-label-md text-label-md text-on-surface-variant block">Valor Total Investido</label>
            <div class="relative flex items-center justify-center">
                <span class="font-numeric-display text-numeric-display text-primary mr-2">R$</span>
                <input
                    class="bg-transparent border-none text-center font-numeric-display text-numeric-display text-on-surface focus:ring-0 w-full outline-none"
                    placeholder="0,00" type="text" value="0,00">
            </div>
        </section>
        <!-- Category Grid -->
        <section class="space-y-stack-md">
            <h2 class="font-label-md text-label-md text-on-surface-variant uppercase tracking-wider">Categorias</h2>
            <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
                <button
                    class="flex flex-col items-center justify-center gap-2 p-4 rounded-xl bg-surface-container hover:bg-surface-container-high transition-all active:scale-95 border border-outline-variant/30 group">
                    <span class="material-symbols-outlined text-primary group-hover:scale-110 transition-transform"
                        data-icon="show_chart">show_chart</span>
                    <span class="font-label-md text-label-md">Ações</span>
                </button>
                <button
                    class="flex flex-col items-center justify-center gap-2 p-4 rounded-xl bg-surface-container hover:bg-surface-container-high transition-all active:scale-95 border border-outline-variant/30 group">
                    <span class="material-symbols-outlined text-primary group-hover:scale-110 transition-transform"
                        data-icon="domain">domain</span>
                    <span class="font-label-md text-label-md">FIIs</span>
                </button>
                <button
                    class="flex flex-col items-center justify-center gap-2 p-4 rounded-xl bg-surface-container hover:bg-surface-container-high transition-all active:scale-95 border border-outline-variant/30 group">
                    <span class="material-symbols-outlined text-primary group-hover:scale-110 transition-transform"
                        data-icon="account_balance">account_balance</span>
                    <span class="font-label-md text-label-md">Renda Fixa</span>
                </button>
                <button
                    class="flex flex-col items-center justify-center gap-2 p-4 rounded-xl bg-surface-container hover:bg-surface-container-high transition-all active:scale-95 border border-outline-variant/30 group">
                    <span class="material-symbols-outlined text-primary group-hover:scale-110 transition-transform"
                        data-icon="currency_bitcoin">currency_bitcoin</span>
                    <span class="font-label-md text-label-md">Cripto</span>
                </button>
            </div>
        </section>
        <!-- Form Fields -->
        <section class="space-y-stack-md pb-12">
            <!-- Asset Search -->
            <div class="relative">
                <span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline"
                    data-icon="search">search</span>
                <input
                    class="w-full bg-surface-container border border-outline-variant rounded-xl py-4 pl-12 pr-4 focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-all font-body-md text-body-md text-on-surface"
                    placeholder="Código ou Nome do Ativo (ex: PETR4, BTC)" type="text">
            </div>
            <div class="grid grid-cols-2 gap-4">
                <div class="space-y-2">
                    <label class="font-label-sm text-label-sm text-on-surface-variant ml-1">Quantidade</label>
                    <input
                        class="w-full bg-surface-container border border-outline-variant rounded-xl py-4 px-4 focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-all font-body-md text-body-md text-on-surface"
                        placeholder="0" type="number">
                </div>
                <div class="space-y-2">
                    <label class="font-label-sm text-label-sm text-on-surface-variant ml-1">Preço Médio (R$)</label>
                    <input
                        class="w-full bg-surface-container border border-outline-variant rounded-xl py-4 px-4 focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-all font-body-md text-body-md text-on-surface"
                        placeholder="0,00" type="text">
                </div>
            </div>
            <div class="space-y-2">
                <label class="font-label-sm text-label-sm text-on-surface-variant ml-1">Data da Compra</label>
                <div class="relative">
                    <span class="material-symbols-outlined absolute right-4 top-1/2 -translate-y-1/2 text-outline"
                        data-icon="calendar_today">calendar_today</span>
                    <input
                        class="w-full bg-surface-container border border-outline-variant rounded-xl py-4 px-4 focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-all font-body-md text-body-md text-on-surface appearance-none"
                        type="date">
                </div>
            </div>
            <div class="space-y-2">
                <label class="font-label-sm text-label-sm text-on-surface-variant ml-1">Corretora</label>
                <div class="relative">
                    <span class="material-symbols-outlined absolute right-4 top-1/2 -translate-y-1/2 text-outline"
                        data-icon="keyboard_arrow_down">keyboard_arrow_down</span>
                    <select
                        class="w-full bg-surface-container border border-outline-variant rounded-xl py-4 px-4 focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-all font-body-md text-body-md text-on-surface appearance-none">
                        <option value="">Selecione a corretora</option>
                        <option value="xp">XP Investimentos</option>
                        <option value="btg">BTG Pactual</option>
                        <option value="nu">NuInvest</option>
                        <option value="inter">Inter</option>
                        <option value="binance">Binance</option>
                        <option value="add_new" class="font-bold text-primary">+ Adicionar corretora</option>
                    </select>
                </div>
            </div>
            <!-- Save Button -->
            <button
                class="w-full h-14 bg-primary text-on-primary font-label-md text-label-md font-bold rounded-xl mt-stack-lg shadow-lg shadow-primary/20 hover:bg-opacity-90 transition-all active:scale-95">
                Salvar Ativo
            </button>
        </section>
    </main>
    <!-- BottomNavBar -->
    <nav
        class="fixed bottom-0 left-0 w-full z-50 flex justify-between items-stretch h-16 bg-surface-container shadow-sm border-t border-outline-variant rounded-t-xl">
        <div
            class="flex-1 flex flex-col items-center justify-center text-on-surface-variant hover:text-primary transition-colors active:scale-95 cursor-pointer">
            <span class="material-symbols-outlined" data-icon="home">home</span>
            <span class="font-label-sm text-label-sm">Home</span>
        </div>
        <div
            class="flex-1 flex flex-col items-center justify-center text-on-surface-variant hover:text-primary transition-colors active:scale-95 cursor-pointer">
            <span class="material-symbols-outlined" data-icon="account_balance_wallet">account_balance_wallet</span>
            <span class="font-label-sm text-label-sm">Transactions</span>
        </div>
        <div
            class="flex-1 flex flex-col items-center justify-center text-on-surface-variant hover:text-primary transition-colors active:scale-95 cursor-pointer">
            <span class="material-symbols-outlined" data-icon="pie_chart">pie_chart</span>
            <span class="font-label-sm text-label-sm">Budgets</span>
        </div>
        <div class="flex-1 flex flex-col items-center justify-center cursor-pointer">
            <div
                class="flex flex-col items-center justify-center bg-primary-container text-on-primary-container rounded-xl w-[90%] py-1 active:scale-95 transition-transform">
                <span class="material-symbols-outlined" data-icon="trending_up">trending_up</span>
                <span class="font-label-sm text-label-sm">Invest</span>
            </div>
        </div>
        <div
            class="flex-1 flex flex-col items-center justify-center text-on-surface-variant hover:text-primary transition-colors active:scale-95 cursor-pointer">
            <span class="material-symbols-outlined" data-icon="person">person</span>
            <span class="font-label-sm text-label-sm">Profile</span>
        </div>
    </nav>
    <!-- Micro-interaction for Category Selection -->
    <script>
        document.querySelectorAll('button.group').forEach(btn => {
            btn.addEventListener('click', () => {
                // Reset all
                document.querySelectorAll('button.group').forEach(b => {
                    b.classList.remove('bg-primary-container', 'text-on-primary-container', 'border-primary');
                    b.classList.add('bg-surface-container', 'text-on-surface');
                });
                // Highlight active
                btn.classList.add('bg-primary-container', 'text-on-primary-container', 'border-primary');
                btn.classList.remove('bg-surface-container', 'text-on-surface');
            });
        });

        // Simple currency formatting for the main value input
        const valueInput = document.querySelector('input[placeholder="0,00"]');
        if (valueInput) {
            valueInput.addEventListener('input', (e) => {
                let val = e.target.value.replace(/\D/g, "");
                if (val === "") val = "0";
                const amount = (parseInt(val) / 100).toLocaleString('pt-BR', {
                    minimumFractionDigits: 2
                });
                e.target.value = amount;
            });
        }
    </script>


</body>

</html>
