<!DOCTYPE html>
<html class="dark" lang="pt-BR">

<head>
    <meta charset="utf-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>Investimentos - Bottom Sheet</title>
    <!-- Material Symbols -->
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
        rel="stylesheet">
    <!-- Google Fonts: Inter -->
    <link href="https://fonts.googleapis.com" rel="preconnect">
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet">
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
        rel="stylesheet">
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <!-- Tailwind Configuration -->
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "error-container": "#93000a",
                        "background": "#11131b",
                        "on-tertiary-container": "#ffede6",
                        "on-surface-variant": "#c3c6d7",
                        "surface-dim": "#11131b",
                        "surface-variant": "#32343d",
                        "surface-container-lowest": "#0c0e16",
                        "surface": "#11131b",
                        "on-error-container": "#ffdad6",
                        "inverse-on-surface": "#2e3039",
                        "on-secondary-fixed": "#0d1c2f",
                        "primary": "#b4c5ff",
                        "surface-container-low": "#191b23",
                        "surface-bright": "#373942",
                        "inverse-primary": "#0053db",
                        "on-tertiary-fixed-variant": "#7d2d00",
                        "on-secondary-container": "#abb9d2",
                        "on-surface": "#e1e2ed",
                        "secondary-container": "#3c4a5e",
                        "on-secondary": "#233144",
                        "tertiary-fixed": "#ffdbcd",
                        "surface-container-highest": "#32343d",
                        "error": "#ffb4ab",
                        "surface-container": "#1d1f27",
                        "on-primary": "#002a78",
                        "on-background": "#e1e2ed",
                        "secondary-fixed-dim": "#b9c7e0",
                        "primary-fixed-dim": "#b4c5ff",
                        "tertiary-fixed-dim": "#ffb596",
                        "on-tertiary": "#581e00",
                        "inverse-surface": "#e1e2ed",
                        "outline-variant": "#434655",
                        "on-secondary-fixed-variant": "#3a485c",
                        "primary-fixed": "#dbe1ff",
                        "on-primary-fixed": "#00174b",
                        "on-error": "#690005",
                        "secondary": "#b9c7e0",
                        "on-primary-fixed-variant": "#003ea8",
                        "surface-tint": "#b4c5ff",
                        "on-tertiary-fixed": "#360f00",
                        "tertiary-container": "#bc4800",
                        "primary-container": "#2563eb",
                        "on-primary-container": "#eeefff",
                        "surface-container-high": "#282a32",
                        "tertiary": "#ffb596",
                        "secondary-fixed": "#d5e3fd",
                        "outline": "#8d90a0"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "stack-sm": "8px",
                        "stack-lg": "24px",
                        "gutter": "16px",
                        "stack-md": "16px",
                        "container-padding-mobile": "20px",
                        "base": "8px",
                        "container-padding-desktop": "32px",
                        "section-gap": "40px"
                    },
                    "fontFamily": {
                        "label-md": ["Inter"],
                        "headline-lg": ["Inter"],
                        "numeric-display": ["Inter"],
                        "label-sm": ["Inter"],
                        "headline-lg-mobile": ["Inter"],
                        "display": ["Inter"],
                        "body-lg": ["Inter"],
                        "headline-md": ["Inter"],
                        "body-md": ["Inter"]
                    },
                    "fontSize": {
                        "label-md": ["14px", { "lineHeight": "20px", "letterSpacing": "0.01em", "fontWeight": "500" }],
                        "headline-lg": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.01em", "fontWeight": "600" }],
                        "numeric-display": ["36px", { "lineHeight": "44px", "letterSpacing": "-0.02em", "fontWeight": "500" }],
                        "label-sm": ["12px", { "lineHeight": "16px", "letterSpacing": "0.02em", "fontWeight": "500" }],
                        "headline-lg-mobile": ["24px", { "lineHeight": "32px", "fontWeight": "600" }],
                        "display": ["40px", { "lineHeight": "48px", "letterSpacing": "-0.02em", "fontWeight": "600" }],
                        "body-lg": ["18px", { "lineHeight": "28px", "fontWeight": "400" }],
                        "headline-md": ["24px", { "lineHeight": "32px", "fontWeight": "600" }],
                        "body-md": ["16px", { "lineHeight": "24px", "fontWeight": "400" }]
                    }
                }
            }
        }
    </script>
    <style>
        /* Custom styles for the blurred background effect to ensure it works across browsers */
        .glass-overlay {
            background-color: rgba(12, 14, 22, 0.6);
            /* surface-container-lowest with opacity */
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }

        /* Smooth entry animation for bottom sheet */
        @keyframes slideUp {
            from {
                transform: translateY(100%);
            }

            to {
                transform: translateY(0);
            }
        }

        .animate-slide-up {
            animation: slideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
    </style>
</head>

<body
    class="text-on-background font-body-md min-h-screen overflow-hidden relative antialiased selection:bg-primary/30 bg-surface">
    <!-- Mock Background: Investment Dashboard (to be blurred) -->
    <div aria-hidden="true" class="absolute inset-0 z-0 flex flex-col p-container-padding-mobile pt-12 select-none">
        <header class="flex justify-between items-center mb-section-gap">
            <h1 class="font-headline-md text-headline-md text-on-surface">Minha Carteira</h1>
            <span class="material-symbols-outlined text-on-surface-variant">notifications</span>
        </header>
        <section class="mb-section-gap">
            <p class="font-label-md text-label-md text-on-surface-variant mb-2">Patrimônio Total</p>
            <h2 class="font-numeric-display text-numeric-display text-on-surface tracking-tight">R$ 142.850,00</h2>
            <div class="flex items-center gap-2 mt-2">
                <span class="material-symbols-outlined text-primary text-[16px]">arrow_upward</span>
                <span class="font-label-md text-label-md text-primary">+2.4% (Hoje)</span>
            </div>
        </section>
        <!-- Decorative Chart Placeholder -->
        <div
            class="w-full h-48 rounded-xl bg-gradient-to-t from-surface-variant to-surface-container-high relative overflow-hidden mb-section-gap border border-outline-variant/20">
            <div class="absolute bottom-0 left-0 w-full h-1/2 bg-gradient-to-t from-primary/10 to-transparent"></div>
            <!-- Mock chart line -->
            <svg class="absolute inset-0 w-full h-full opacity-50" preserveAspectRatio="none" viewBox="0 0 100 100">
                <path class="text-primary" d="M0,80 Q10,60 20,70 T40,40 T60,50 T80,20 T100,10" fill="none"
                    stroke="currentColor" stroke-width="2"></path>
            </svg>
        </div>
        <div class="flex flex-col gap-4">
            <div class="h-16 rounded-xl bg-surface-container border border-outline-variant/10"></div>
            <div class="h-16 rounded-xl bg-surface-container border border-outline-variant/10"></div>
            <div class="h-16 rounded-xl bg-surface-container border border-outline-variant/10"></div>
        </div>
    </div>
    <!-- The Glass Overlay / Scrim -->
    <div aria-hidden="true" class="fixed inset-0 z-40 glass-overlay transition-opacity duration-300"></div>
    <!-- Bottom Sheet Modal -->
    <div aria-labelledby="modal-title" aria-modal="true"
        class="fixed bottom-0 left-0 right-0 z-50 flex justify-center w-full animate-slide-up" role="dialog">
        <!-- Modal Container -->
        <div
            class="w-full max-w-2xl bg-surface-container rounded-t-[32px] shadow-[0_-8px_32px_rgba(0,0,0,0.4)] border-t border-outline-variant/20 flex flex-col pb-safe">
            <!-- Drag Handle Area -->
            <div class="w-full pt-4 pb-2 flex justify-center cursor-grab active:cursor-grabbing">
                <div class="w-12 h-1.5 rounded-full bg-outline-variant/40"></div>
            </div>
            <!-- Header Content -->
            <div class="px-container-padding-mobile pt-2 pb-6">
                <h2 class="font-headline-md text-headline-md text-on-surface mb-1" id="modal-title">Investimentos</h2>
                <p class="font-body-md text-body-md text-on-surface-variant">Gerencie suas operações e ativos</p>
            </div>
            <!-- Options List -->
            <div class="px-gutter pb-8 flex flex-col gap-2">
                <!-- Option 1 -->
                <button
                    class="w-full flex items-center p-4 rounded-xl hover:bg-surface-variant/50 active:bg-surface-variant transition-colors group text-left focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2 focus:ring-offset-surface-container">
                    <div
                        class="w-12 h-12 rounded-full bg-surface-variant/30 flex items-center justify-center text-primary group-hover:bg-primary/10 transition-colors mr-4 shrink-0">
                        <span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">sync</span>
                    </div>
                    <div class="flex-1">
                        <span class="font-label-md text-label-md text-on-surface block mb-0.5">Atualizar cotações</span>
                        <span class="font-label-sm text-label-sm text-on-surface-variant block">Sincronizar preços em
                            tempo real</span>
                    </div>
                </button>
                <!-- Option 2 -->
                <button
                    class="w-full flex items-center p-4 rounded-xl hover:bg-surface-variant/50 active:bg-surface-variant transition-colors group text-left focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2 focus:ring-offset-surface-container">
                    <div
                        class="w-12 h-12 rounded-full bg-surface-variant/30 flex items-center justify-center text-primary group-hover:bg-primary/10 transition-colors mr-4 shrink-0">
                        <span class="material-symbols-outlined"
                            style="font-variation-settings: 'FILL' 0;">analytics</span>
                    </div>
                    <div class="flex-1">
                        <span class="font-label-md text-label-md text-on-surface block mb-0.5">Relatório de
                            rentabilidade</span>
                        <span class="font-label-sm text-label-sm text-on-surface-variant block">Análise detalhada de
                            performance</span>
                    </div>
                </button>
                <!-- Option 3 -->

            </div>
            <!-- Safe area padding for newer iPhones -->
            <div class="h-6 w-full hidden supports-[padding-bottom:env(safe-area-inset-bottom)]:block"
                style="padding-bottom: env(safe-area-inset-bottom);"></div>
        </div>
    </div>






</body>

</html>
