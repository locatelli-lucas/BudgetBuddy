    <style>
        /* Custom scrollbar for webkit */

            width: 8px;
        }

        ::-webkit-scrollbar-track {

        }

        }

        }

            }

<body
    class="text-on-background font-body-md antialiased overflow-hidden min-h-screen relative flex flex-col bg-surface">

    <div class="absolute inset-0 z-0 flex flex-col">
        <!-- Mock header -->

            </button>
            <div class="flex flex-1 items-center">
                <span class="font-headline-md text-headline-md text-on-surface">BudgetBuddy</span>
            </div>
            <div class="flex items-center gap-2">

                    <span class="material-symbols-outlined">notifications</span>
                </button>
            </div>
        </header>
        <!-- Mock Content -->
        <main class="flex-1 p-container-padding-desktop flex flex-col gap-section-gap">
            <div class="flex flex-col gap-stack-sm">
                <h1 class="font-headline-lg text-headline-lg text-on-surface">Relatório Mensal</h1>
                <p class="font-body-md text-body-md text-on-surface-variant">Novembro 2023</p>

            <div class="grid grid-cols-1 md:grid-cols-3 gap-gutter">
                <div class="bg-surface-container rounded-xl p-stack-lg flex flex-col gap-stack-sm h-32"></div>

            </div>
            <div class="bg-surface-container rounded-xl p-stack-lg flex-1"></div>
        </main>
    </div>
    <!-- Overlay Scrim -->
    <div aria-hidden="true" class="fixed inset-0 bg-black/60 z-40"></div>
    <!-- Bottom Sheet Modal -->
    <div class="fixed bottom-0 left-0 right-0 z-50 w-full flex flex-col justify-end pointer-events-none h-full">
        <div
            class="bg-surface rounded-t-[24px] shadow-lg w-full bottom-sheet-animate pointer-events-auto flex flex-col">
            <!-- Pull Handle -->
            <div class="w-full flex justify-center pt-4 pb-2 cursor-pointer">

            </div>
            <!-- Content area -->
            <div class="px-container-padding-mobile pt-2 pb-stack-lg flex flex-col gap-stack-sm">
                <h2 class="font-headline-md text-headline-md text-on-surface text-center sm:text-left">Confirmar
                    Exclusão</h2>
                <p class="font-body-md text-body-md text-on-surface-variant text-center sm:text-left">
                    Tem certeza que deseja excluir permanentemente este relatório? Esta ação não poderá ser desfeita.
                </p>
            </div>
            <!-- Actions area -->

                    class="w-full sm:w-auto h-14 sm:h-12 px-6 rounded-lg bg-error hover:bg-error/90 font-label-md text-label-md text-on-error transition-colors flex items-center justify-center shadow-sm">
                    Sim, excluir

                    class="w-full sm:w-auto h-14 sm:h-12 px-6 rounded-lg font-label-md text-label-md text-on-surface-variant hover:text-on-surface hover:bg-surface-variant transition-colors flex items-center justify-center">

                </button>

            <div class="h-6 w-full"></div>
        </div>
