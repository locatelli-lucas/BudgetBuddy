    <style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }

        /* Animation for the bottom sheet */
        @keyframes slideUp {
            from {
                transform: translateY(100%);
            }

            to {
                transform: translateY(0);
            }
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }

        .animate-slide-up {
            animation: slideUp 0.3s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
        }

        .animate-fade-in {
            animation: fadeIn 0.2s ease-out forwards;
        }
    </style>

<body
    class="text-on-surface font-body-md min-h-screen relative overflow-hidden flex flex-col items-center justify-center bg-surface">
    <!-- Mock Background App Content to provide context -->
    <div class="w-full h-full max-w-md mx-auto bg-background relative flex flex-col opacity-30">
        <!-- TopAppBar (Mock) -->
        <header
            class="w-full sticky top-0 bg-background flex justify-between items-center px-container-padding-mobile py-4 z-10">
            <button class="text-on-surface-variant hover:opacity-80 transition-opacity">
                <span class="material-symbols-outlined text-2xl">arrow_back</span>
            </button>
            <h1 class="font-headline-md text-headline-md text-primary">BudgetBuddy</h1>
            <button class="text-on-surface hover:opacity-80 transition-opacity">
                <span class="material-symbols-outlined text-2xl">more_vert</span>
            </button>
        </header>
        <main class="flex-1 p-container-padding-mobile space-y-stack-lg pb-16">
            <div class="space-y-stack-sm">
                <h2 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface">Relatório Mensal</h2>
                <p class="font-body-md text-body-md text-on-surface-variant">Novembro 2023</p>
            </div>
            <div
                class="bg-surface-container rounded-xl p-6 flex flex-col items-center justify-center h-48 border border-outline-variant/30">
                <span class="material-symbols-outlined text-4xl text-primary mb-2">insert_chart</span>
                <p class="text-on-surface-variant">Gráfico de Despesas</p>
            </div>
            <div class="space-y-stack-md">
                <div class="h-16 bg-surface-container rounded-lg border border-outline-variant/30"></div>
                <div class="h-16 bg-surface-container rounded-lg border border-outline-variant/30"></div>
                <div class="h-16 bg-surface-container rounded-lg border border-outline-variant/30"></div>
            </div>
        </main>
        <nav
            class="mt-auto w-full bg-surface-container border-t border-outline-variant/30 px-container-padding-mobile py-2 flex justify-between items-center">
            <button class="flex flex-col items-center gap-1 text-primary hover:opacity-80 transition-opacity"><span
                    class="material-symbols-outlined">home</span><span
                    class="text-label-sm font-label-sm">In%C3%ADcio</span></button><button
                class="flex flex-col items-center gap-1 text-on-surface-variant hover:opacity-80 transition-opacity"><span
                    class="material-symbols-outlined">receipt_long</span><span
                    class="text-label-sm font-label-sm">Transa%C3%A7%C3%B5es</span></button><button
                class="flex flex-col items-center gap-1 text-on-surface-variant hover:opacity-80 transition-opacity"><span
                    class="material-symbols-outlined">account_balance_wallet</span><span
                    class="text-label-sm font-label-sm">Or%C3%A7amentos</span></button><button
                class="flex flex-col items-center gap-1 text-on-surface-variant hover:opacity-80 transition-opacity"><span
                    class="material-symbols-outlined">trending_up</span><span
                    class="text-label-sm font-label-sm">Investir</span></button><button

                    class="material-symbols-outlined">person</span><span
                    class="text-label-sm font-label-sm">Perfil</span></button></nav>
    </div>
    <!-- 
      BOTTOM SHEET COMPONENT 
      This is the primary focus of the task.
    -->
    <!-- Scrim (Dark Overlay) -->
    <div aria-hidden="true" class="fixed inset-0 bg-black/60 z-40 animate-fade-in backdrop-blur-sm transition-opacity"
        id="bottom-sheet-scrim"></div>
    <!-- Bottom Sheet Container -->
    <div class="fixed left-0 right-0 z-50 flex justify-center pointer-events-none px-0 sm:px-4 sm:pb-4 bottom-4">
        <div aria-labelledby="bottom-sheet-title" aria-modal="true"
            class="w-full max-w-md bg-surface-container-high rounded-t-3xl sm:rounded-3xl shadow-[0_-8px_30px_rgba(0,0,0,0.3)] animate-slide-up pointer-events-auto flex flex-col border-t sm:border border-outline-variant/20"
            role="dialog">
            <!-- Drag Handle (Visual indicator) -->
            <div class="w-full flex justify-center pt-4 pb-2 cursor-grab active:cursor-grabbing" id="drag-handle">
                <div class="w-12 h-1.5 bg-outline-variant rounded-full opacity-60"></div>
            </div>
            <!-- Header -->
            <div class="px-container-padding-mobile pb-4 flex items-center justify-between">
                <h2 class="font-headline-md text-headline-md text-on-surface" id="bottom-sheet-title">Opções do
                    Relatório</h2>
                <div class="flex items-center">
                    <button aria-label="Fechar"
                        class="w-10 h-10 rounded-full flex items-center justify-center text-on-surface-variant hover:bg-surface-variant transition-colors"
                        onclick="closeSheet()">
                        <span class="material-symbols-outlined" data-icon="close">close</span>
                    </button>
                </div>
            </div>
            <!-- Options List -->
            <div class="px-2 pb-container-padding-mobile flex flex-col space-y-1">
                <!-- Option: Imprimir -->
                <button
                    class="w-full flex items-center px-4 py-4 rounded-xl hover:bg-surface-variant transition-colors text-left group">
                    <span
                        class="material-symbols-outlined text-on-surface-variant group-hover:text-primary transition-colors mr-4"
                        data-icon="print">print</span>
                    <span class="font-body-lg text-body-lg text-on-surface flex-1">Imprimir Relatório</span>
                </button>
                <!-- Option: Enviar por E-mail -->
                <button
                    class="w-full flex items-center px-4 py-4 rounded-xl hover:bg-surface-variant transition-colors text-left group">
                    <span
                        class="material-symbols-outlined text-on-surface-variant group-hover:text-primary transition-colors mr-4"
                        data-icon="mail">mail</span>
                    <span class="font-body-lg text-body-lg text-on-surface flex-1">Enviar por E-mail</span>
                </button>
                <!-- Option: Configurações -->

                <!-- Divider -->
                <div class="h-px w-[calc(100%-32px)] mx-auto bg-outline-variant/30 my-2"></div>
                <!-- Option: Excluir (Destructive) -->
                <button
                    class="w-full flex items-center px-4 py-4 rounded-xl hover:bg-error-container/20 transition-colors text-left group mt-1">
                    <span class="material-symbols-outlined text-error mr-4" data-icon="delete">delete</span>
                    <span class="font-body-lg text-body-lg text-error flex-1">Excluir Relatório</span>
                </button>
            </div>
        </div>
    </div>
    <!-- Minimal script for demo purposes to allow dismissing -->
    <script>
        function closeSheet() {
            const sheet = document.querySelector('[role="dialog"]').parentElement;
            const scrim = document.getElementById('bottom-sheet-scrim');

            // Apply closing animations
            sheet.firstElementChild.style.transform = 'translateY(100%)';
            sheet.firstElementChild.style.transition = 'transform 0.25s cubic-bezier(0.4, 0, 0.2, 1)';
            scrim.style.opacity = '0';

            // Remove after animation completes
            setTimeout(() => {
                sheet.style.display = 'none';
                scrim.style.display = 'none';
            }, 250);
        }

        // Allow closing by clicking the scrim
        document.getElementById('bottom-sheet-scrim').addEventListener('click', closeSheet);
    </script>
