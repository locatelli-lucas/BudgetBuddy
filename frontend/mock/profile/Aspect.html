<!DOCTYPE html>
<html class="dark" lang="pt-BR">

<head>
    <meta charset="utf-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>Aparência</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
        rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
        rel="stylesheet">
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "error-container": "#93000a",
                        "background": "#11131b",
                        "on-tertiary-container": "#ffede6",
                        "on-surface-variant": "#c3c6d7",
                        "surface-dim": "#11131b",
                        "surface-variant": "#32343d",
                        "surface-container-lowest": "#0c0e16",
                        "surface": "#11131b",
                        "on-error-container": "#ffdad6",
                        "inverse-on-surface": "#2e3039",
                        "on-secondary-fixed": "#0d1c2f",
                        "primary": "#b4c5ff",
                        "surface-container-low": "#191b23",
                        "surface-bright": "#373942",
                        "inverse-primary": "#0053db",
                        "on-tertiary-fixed-variant": "#7d2d00",
                        "on-secondary-container": "#abb9d2",
                        "on-surface": "#e1e2ed",
                        "secondary-container": "#3c4a5e",
                        "on-secondary": "#233144",
                        "tertiary-fixed": "#ffdbcd",
                        "surface-container-highest": "#32343d",
                        "error": "#ffb4ab",
                        "surface-container": "#1d1f27",
                        "on-primary": "#002a78",
                        "on-background": "#e1e2ed",
                        "secondary-fixed-dim": "#b9c7e0",
                        "primary-fixed-dim": "#b4c5ff",
                        "tertiary-fixed-dim": "#ffb596",
                        "on-tertiary": "#581e00",
                        "inverse-surface": "#e1e2ed",
                        "outline-variant": "#434655",
                        "on-secondary-fixed-variant": "#3a485c",
                        "primary-fixed": "#dbe1ff",
                        "on-primary-fixed": "#00174b",
                        "on-error": "#690005",
                        "secondary": "#b9c7e0",
                        "on-primary-fixed-variant": "#003ea8",
                        "surface-tint": "#b4c5ff",
                        "on-tertiary-fixed": "#360f00",
                        "tertiary-container": "#bc4800",
                        "primary-container": "#2563eb",
                        "on-primary-container": "#eeefff",
                        "surface-container-high": "#282a32",
                        "tertiary": "#ffb596",
                        "secondary-fixed": "#d5e3fd",
                        "outline": "#8d90a0"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "stack-sm": "8px",
                        "stack-lg": "24px",
                        "gutter": "16px",
                        "stack-md": "16px",
                        "container-padding-mobile": "20px",
                        "base": "8px",
                        "container-padding-desktop": "32px",
                        "section-gap": "40px"
                    },
                    "fontFamily": {
                        "label-md": ["Inter"],
                        "headline-lg": ["Inter"],
                        "numeric-display": ["Inter"],
                        "label-sm": ["Inter"],
                        "headline-lg-mobile": ["Inter"],
                        "display": ["Inter"],
                        "body-lg": ["Inter"],
                        "headline-md": ["Inter"],
                        "body-md": ["Inter"]
                    },
                    "fontSize": {
                        "label-md": ["14px", { "lineHeight": "20px", "letterSpacing": "0.01em", "fontWeight": "500" }],
                        "headline-lg": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.01em", "fontWeight": "600" }],
                        "numeric-display": ["36px", { "lineHeight": "44px", "letterSpacing": "-0.02em", "fontWeight": "500" }],
                        "label-sm": ["12px", { "lineHeight": "16px", "letterSpacing": "0.02em", "fontWeight": "500" }],
                        "headline-lg-mobile": ["24px", { "lineHeight": "32px", "fontWeight": "600" }],
                        "display": ["40px", { "lineHeight": "48px", "letterSpacing": "-0.02em", "fontWeight": "600" }],
                        "body-lg": ["18px", { "lineHeight": "28px", "fontWeight": "400" }],
                        "headline-md": ["24px", { "lineHeight": "32px", "fontWeight": "600" }],
                        "body-md": ["16px", { "lineHeight": "24px", "fontWeight": "400" }]
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }

        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }

        .hide-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>

<body
    class="text-on-background min-h-screen flex flex-col antialiased selection:bg-primary-container selection:text-on-primary-container bg-surface">
    <!-- TopAppBar -->
    <header class="w-full top-0 sticky z-40 bg-surface">
        <div class="flex items-center justify-between px-gutter py-stack-md w-full">
            <button
                class="text-on-surface-variant hover:bg-surface-variant transition-colors active:opacity-80 p-2 rounded-full flex items-center justify-center">
                <span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
            </button>
            <h1 class="font-headline-md text-headline-md font-bold text-primary">Aparência</h1>
            <div class="w-10"></div> <!-- Spacer for alignment -->
        </div>
    </header>
    <!-- Main Content Canvas -->
    <main class="flex-grow px-container-padding-mobile md:px-container-padding-desktop pb-24 space-y-section-gap">
        <!-- Tema Section -->
        <section class="space-y-stack-md">
            <h2
                class="font-headline-lg-mobile md:font-headline-lg text-headline-lg-mobile md:text-headline-lg text-on-background">
                Tema</h2>
            <div class="grid grid-cols-3 gap-gutter">
                <!-- System Theme -->
                <button
                    class="bg-surface-container rounded-xl p-stack-md border border-outline-variant hover:bg-surface-variant transition-colors flex flex-col items-center gap-stack-sm active:scale-95">
                    <span class="material-symbols-outlined text-[32px] text-on-surface-variant"
                        data-icon="brightness_auto">brightness_auto</span>
                    <span class="font-label-md text-label-md text-on-surface">Sistema</span>
                </button>
                <!-- Light Theme -->
                <button
                    class="bg-surface-container rounded-xl p-stack-md border border-transparent hover:bg-surface-variant transition-colors flex flex-col items-center gap-stack-sm active:scale-95">
                    <span class="material-symbols-outlined text-[32px] text-on-surface-variant"
                        data-icon="light_mode">light_mode</span>
                    <span class="font-label-md text-label-md text-on-surface">Claro</span>
                </button>
                <!-- Dark Theme (Active) -->
                <button
                    class="bg-surface-container-high rounded-xl p-stack-md border-2 border-primary hover:bg-surface-variant transition-colors flex flex-col items-center gap-stack-sm active:scale-95">
                    <span class="material-symbols-outlined text-[32px] text-primary"
                        data-icon="dark_mode">dark_mode</span>
                    <span class="font-label-md text-label-md text-primary">Escuro</span>
                </button>
            </div>
        </section>
        <!-- Cor de Destaque Section -->
        <section class="space-y-stack-md">
            <h2
                class="font-headline-lg-mobile md:font-headline-lg text-headline-lg-mobile md:text-headline-lg text-on-background">
                Cor de Destaque</h2>
            <div class="bg-surface-container rounded-xl p-stack-md">
                <div class="flex justify-between items-center px-4">
                    <!-- Blue (Active) -->
                    <button
                        class="w-12 h-12 rounded-full bg-blue-500 ring-2 ring-offset-2 ring-offset-surface-container ring-primary flex items-center justify-center transition-transform hover:scale-110">
                        <span class="material-symbols-outlined text-white text-sm" data-icon="check">check</span>
                    </button>
                    <!-- Green -->
                    <button
                        class="w-12 h-12 rounded-full bg-emerald-500 ring-0 ring-offset-2 ring-offset-surface-container hover:ring-2 hover:ring-outline-variant transition-all hover:scale-110"></button>
                    <!-- Orange -->
                    <button
                        class="w-12 h-12 rounded-full bg-orange-500 ring-0 ring-offset-2 ring-offset-surface-container hover:ring-2 hover:ring-outline-variant transition-all hover:scale-110"></button>
                    <!-- Purple -->
                    <button
                        class="w-12 h-12 rounded-full bg-purple-500 ring-0 ring-offset-2 ring-offset-surface-container hover:ring-2 hover:ring-outline-variant transition-all hover:scale-110"></button>
                </div>
            </div>
        </section>
        <!-- Estilo dos Ícones Section -->
        <section class="space-y-stack-md">
            <h2
                class="font-headline-lg-mobile md:font-headline-lg text-headline-lg-mobile md:text-headline-lg text-on-background">
                Estilo dos Ícones</h2>
            <div class="grid grid-cols-2 gap-gutter">
                <!-- Outlined (Active) -->
                <button
                    class="bg-surface-container-high rounded-xl p-stack-md border-2 border-primary hover:bg-surface-variant transition-colors flex flex-col items-center gap-stack-sm active:scale-95">
                    <span class="material-symbols-outlined text-[32px] text-primary" data-icon="star">star</span>
                    <span class="font-label-md text-label-md text-primary">Contornados</span>
                </button>
                <!-- Filled -->
                <button
                    class="bg-surface-container rounded-xl p-stack-md border border-transparent hover:bg-surface-variant transition-colors flex flex-col items-center gap-stack-sm active:scale-95">
                    <span class="material-symbols-outlined text-[32px] text-on-surface-variant" data-icon="star"
                        data-weight="fill" style="font-variation-settings: 'FILL' 1;">star</span>
                    <span class="font-label-md text-label-md text-on-surface">Preenchidos</span>
                </button>
            </div>
        </section>
    </main>
    <!-- BottomNavBar -->
    <nav
        class="fixed bottom-0 w-full z-50 rounded-t-xl bg-surface-container dark:bg-surface-container shadow-[0_-4px_12px_rgba(0,0,0,0.2)] md:hidden">
        <div class="flex justify-around items-center h-[72px] px-2 pb-safe w-full">
            <button
                class="flex flex-col items-center justify-center text-on-surface-variant hover:text-primary transition-all scale-95 active:scale-90">
                <span class="material-symbols-outlined" data-icon="home">home</span>
                <span class="font-label-sm text-label-sm mt-1">Início</span>
            </button>
            <button
                class="flex flex-col items-center justify-center text-on-surface-variant hover:text-primary transition-all scale-95 active:scale-90">
                <span class="material-symbols-outlined" data-icon="account_balance_wallet">account_balance_wallet</span>
                <span class="font-label-sm text-label-sm mt-1">Transações</span>
            </button>
            <button
                class="flex flex-col items-center justify-center text-on-surface-variant hover:text-primary transition-all scale-95 active:scale-90">
                <span class="material-symbols-outlined" data-icon="pie_chart">pie_chart</span>
                <span class="font-label-sm text-label-sm mt-1">Orçamentos</span>
            </button>
            <button
                class="flex flex-col items-center justify-center text-on-surface-variant hover:text-primary transition-all scale-95 active:scale-90">
                <span class="material-symbols-outlined" data-icon="trending_up">trending_up</span>
                <span class="font-label-sm text-label-sm mt-1">Investir</span>
            </button>
            <button
                class="flex flex-col items-center justify-center bg-secondary-container text-on-secondary-container rounded-full px-4 py-1 hover:text-primary transition-all scale-95 active:scale-90">
                <span class="material-symbols-outlined" data-icon="person">person</span>
                <span class="font-label-sm text-label-sm mt-1">Perfil</span>
            </button>
        </div>
    </nav>




</body>

</html>
