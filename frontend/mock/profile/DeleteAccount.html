<body class="bg-background text-on-background min-h-screen relative overflow-hidden">
    <!-- Background App Screen Mock (Security Screen) -->
    <div class="absolute inset-0 z-0 bg-cover bg-center bg-no-repeat"
        style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuBRi4gRvMwqkz6xHC7JjWTAXYKofw6Cg8tvVk_oG3YZg2jgrL7cYaESkPZh0mrQBbwFGWGVaKB1LyzlU2HZnMC8zLzSGzo_BhzyLBpgQH4g1yPDKO6RRv9UUj4ybg0SoeWIrUKbeyCgja5H1pJZa8_6fLPGyZpCoB0xVjGr4YuMHcnVuVCoVk_4JiStTiH1G1tI6cidS0MlrVlPsnbi6n72UoDjNjDQqTQy5Gi45Z7oOo9_A41jG_vNz0Orfw_A-DY3M7c1K5eahDA');">
        <!-- Overlay to slightly dim the raw screen if needed before the modal backdrop -->
        <div class="absolute inset-0 bg-background/40"></div>
    </div>
    <!-- Confirmation Modal Overlay -->
    <div class="fixed inset-0 z-50 flex items-center justify-center p-container-padding-mobile bg-background/80 backdrop-blur-sm animate-fade-in"
        id="modal-overlay">
        <!-- Modal Container (Level 2 Elevation concept) -->
        <div class="w-full max-w-[400px] bg-surface-container-high rounded-xl shadow-2xl p-stack-lg flex flex-col gap-stack-lg transform transition-all scale-100 opacity-100"
            id="dialog-card">
            <!-- Icon & Text Content -->
            <div class="flex flex-col items-center text-center gap-stack-md">
                <!-- Destructive Action Icon -->
                <div
                    class="w-16 h-16 rounded-full bg-error-container/20 flex items-center justify-center text-error mb-2">
                    <span class="material-symbols-outlined text-[32px]"
                        style="font-variation-settings: 'FILL' 1;">warning</span>
                </div>
                <div class="flex flex-col gap-stack-sm">
                    <h2 class="font-headline-md text-headline-md text-on-surface">Encerrar conta?</h2>
                    <p class="font-body-md text-body-md text-on-surface-variant px-2">
                        Você tem certeza que deseja iniciar o processo de encerramento da sua conta no BudgetBuddy?
                    </p>
                </div>
            </div>
            <!-- Action Buttons -->
            <div class="flex flex-col-reverse sm:flex-row gap-stack-sm mt-4 w-full">
                <!-- Secondary Action (Outline/Ghost) -->
                <button
                    class="flex-1 min-h-[56px] px-6 rounded-full border border-outline text-primary font-label-md text-label-md hover:bg-surface-variant hover:text-primary-fixed transition-colors flex items-center justify-center focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2 focus:ring-offset-surface-container-high"
                    type="button">
                    Cancelar
                </button>
                <!-- Primary Action (Dangerous/Solid) -->
                <button
                    class="flex-1 min-h-[56px] px-6 rounded-full bg-error text-on-error font-label-md text-label-md hover:bg-error/90 active:scale-95 transition-all flex items-center justify-center focus:outline-none focus:ring-2 focus:ring-error focus:ring-offset-2 focus:ring-offset-surface-container-high shadow-sm shadow-error/20"
                    type="button">
                    Sim, continuar
                </button>
            </div>
        </div>
    </div>
    <!-- Minimal script for simple entrance animation if desired -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const overlay = document.getElementById('modal-overlay');
            const card = document.getElementById('dialog-card');

            // Simple initial pop-in effect
            card.style.transform = 'scale(0.95)';
            card.style.opacity = '0';

            setTimeout(() => {
                card.style.transition = 'all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275)';
                card.style.transform = 'scale(1)';
                card.style.opacity = '1';
            }, 50);
        });
    </script>
</body>

</html>
