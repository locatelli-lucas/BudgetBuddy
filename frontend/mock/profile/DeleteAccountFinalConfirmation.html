        }

        /* Subtle modal entry animation */
        @keyframes modal-enter {
            0% {
                opacity: 0;
                transform: scale(0.95) translateY(10px);
            }

            100% {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }

<body class="bg-background text-on-background font-body-md antialiased min-h-screen overflow-hidden">
    <!-- Mock Background Content (Blurred out to provide context of the "Security & Account" screen) -->
    <div aria-hidden="true"
        class="absolute inset-0 z-0 p-gutter flex flex-col gap-stack-lg opacity-40 blur-[2px] pointer-events-none select-none">
        <header class="flex items-center gap-stack-md h-16 w-full max-w-7xl mx-auto">
            <span class="material-symbols-outlined text-primary text-[24px]">arrow_back</span>
            <h1 class="font-headline-md text-headline-md text-on-surface">Security &amp; Account</h1>
        </header>
        <main class="w-full max-w-7xl mx-auto flex flex-col gap-stack-md">
            <div class="h-[120px] bg-surface-container rounded-xl w-full"></div>
            <div class="h-[60px] bg-surface-container rounded-xl w-full"></div>
            <div class="h-[60px] bg-surface-container rounded-xl w-full"></div>
            <div class="h-[60px] bg-error-container/20 rounded-xl w-full mt-stack-lg"></div>
        </main>
    </div>
    <!-- Modal Overlay Backdrop -->
    <div
        class="fixed inset-0 z-50 bg-background/80 backdrop-blur-md flex items-center justify-center p-container-padding-mobile md:p-container-padding-desktop">
        <!-- Dialog Container (Level 2 Elevation) -->
        <dialog
            class="relative bg-surface-container-high w-full max-w-[420px] rounded-xl shadow-2xl border border-outline-variant/10 p-stack-lg animate-modal-enter m-0 inset-auto flex flex-col items-center text-center"
            open="">
            <!-- Icon Area -->
            <div class="w-16 h-16 rounded-full bg-error-container/20 flex items-center justify-center mb-stack-md">
                <span class="material-symbols-outlined fill text-error text-[32px]"
                    style="font-variation-settings: 'FILL' 1;">warning</span>
            </div>
            <!-- Text Content -->
            <h2 class="font-headline-md text-headline-md text-on-surface mb-stack-sm w-full">
                Aviso Final
            </h2>
            <p class="font-body-md text-body-md text-on-surface-variant mb-section-gap w-full">
                Todos os seus dados de transações, orçamentos, investimentos e metas serão DELETADOS PERMANENTEMENTE.
                Esta ação não pode ser desfeita.
            </p>
            <!-- Actions (Stacked for high-impact distinct choices on mobile, preserving full width) -->
            <div class="flex flex-col gap-stack-md w-full">
                <!-- Primary Destructive Action -->
                <button
                    class="w-full flex items-center justify-center bg-error text-on-error font-label-md text-label-md h-[56px] rounded-lg transition-all duration-200 hover:bg-[#ff897d] active:scale-[0.98] active:bg-error shadow-[0_4px_12px_rgba(255,180,171,0.15)]">
                    Confirmar e Deletar Tudo
                </button>
                <!-- Secondary Cancel Action -->
                <button
                    class="w-full flex items-center justify-center bg-surface-container text-on-surface font-label-md text-label-md h-[56px] rounded-lg transition-all duration-200 hover:bg-surface-variant hover:text-primary active:scale-[0.98]">
                    Voltar
                </button>
            </div>
        </dialog>
    </div>
