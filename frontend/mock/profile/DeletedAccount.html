<!DOCTYPE html>

<html class="dark" lang="pt-BR">

<head>
    <meta charset="utf-8" />

    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #11131b;
            /* background */
            color: #e1e2ed;
            /* on-background */
        }
    </style>
    <style>
        body {
            min-height: max(884px, 100dvh);
        }
    </style>
</head>

<body
    class="min-h-screen flex flex-col items-center antialiased bg-background text-on-background selection:bg-primary-container selection:text-on-primary-container">
    <!-- TopAppBar Component -->
    <header class="w-full top-0 sticky bg-background dark:bg-background flat no shadows z-50">
        <div
            class="flex justify-center items-center px-container-padding-mobile md:px-container-padding-desktop h-14 w-full">
            <span class="font-headline-md text-headline-md font-bold text-primary dark:text-primary tracking-tight">
                BudgetBuddy
            </span>
        </div>
    </header>
    <!-- Main Content Canvas -->
    <main
        class="flex-grow flex flex-col items-center justify-center w-full max-w-md mx-auto px-container-padding-mobile md:px-container-padding-desktop py-section-gap text-center">
        <!-- Animated Success Icon Wrapper -->
        <div class="mb-stack-lg animate-[bounce_1s_ease-in-out_infinite]" style="animation-iteration-count: 1;">
            <div class="w-24 h-24 rounded-full bg-primary-container/20 flex items-center justify-center">
                <span class="material-symbols-outlined text-[64px] text-primary"
                    style="font-variation-settings: 'FILL' 1;">
                    check_circle
                </span>
            </div>
        </div>
        <!-- Typography Content -->
        <div class="flex flex-col gap-stack-md mb-section-gap">
            <h1
                class="font-headline-lg-mobile text-headline-lg-mobile md:font-headline-lg md:text-headline-lg text-on-background">
                Sua conta foi encerrada
            </h1>
            <p class="font-body-md text-body-md text-on-surface-variant max-w-[320px] mx-auto">
                Sentiremos sua falta! Todos os seus dados foram removidos permanentemente dos nossos servidores conforme
                solicitado.
            </p>
        </div>
        <!-- Primary Action -->
        <div class="w-full mt-auto mb-stack-lg md:mt-0">
            <button
                class="w-full min-h-[56px] rounded-lg bg-primary-container text-on-primary-container font-label-md text-label-md hover:bg-primary-container/90 transition-colors duration-200 shadow-md">
                Voltar para o Início
            </button>
        </div>
    </main>
    <!-- Contextual FAB Suppression: Applied (No FAB for transactional/success screen) -->
    <!-- Navigation Shell Suppression: Applied (No BottomNavBar/SideNav for success screen) -->
</body>

</html>
