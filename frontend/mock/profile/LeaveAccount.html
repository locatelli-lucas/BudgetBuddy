                <div class="w-16 h-16 rounded-full bg-error-container/20 flex items-center justify-center mb-4">
                    <span class="material-symbols-outlined text-error text-[32px]">logout</span>
                </div>
                <h2 class="font-headline-md text-headline-md text-on-surface mb-2">Sair da conta?</h2>
                <p class="font-body-md text-body-md text-on-surface-variant">
                    Tem certeza que deseja encerrar sua sessão? Você precisará entrar novamente para acessar seus dados.
                </p>
            </div>
            <!-- Actions -->
            <div class="flex flex-col gap-3 p-6 pt-2">
                <button
                    class="w-full h-[56px] rounded-lg border border-error text-error hover:bg-error/10 active:bg-error/20 font-label-md text-label-md transition-colors flex items-center justify-center"
