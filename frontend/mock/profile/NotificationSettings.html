<!DOCTYPE html>

<html class="dark" lang="pt-BR">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Configurar Notificação - BudgetBuddy</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"

    <link href="https://fonts.googleapis.com" rel="preconnect" />
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap"
        rel="stylesheet" />
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
        rel="stylesheet" />
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "surface-bright": "#373942",
                        "surface-container-lowest": "#0c0e16",
                        "inverse-surface": "#e1e2ed",
                        "on-primary-container": "#eeefff",
                        "on-background": "#e1e2ed",
                        "surface-container-high": "#282a32",
                        "on-error": "#690005",
                        "outline-variant": "#434655",
                        "secondary-container": "#3c4a5e",
                        "surface-dim": "#11131b",
                        "secondary-fixed": "#d5e3fd",
                        "on-secondary": "#233144",
                        "surface-variant": "#32343d",
                        "on-secondary-container": "#abb9d2",
                        "surface-container-low": "#191b23",
                        "on-surface": "#e1e2ed",
                        "surface-container-highest": "#32343d",
                        "surface": "#11131b",
                        "on-primary": "#002a78",
                        "tertiary": "#ffb596",
                        "on-tertiary": "#581e00",
                        "on-secondary-fixed-variant": "#3a485c",
                        "secondary-fixed-dim": "#b9c7e0",
                        "surface-container": "#1d1f27",
                        "outline": "#8d90a0",
                        "on-surface-variant": "#c3c6d7",
                        "on-tertiary-container": "#ffede6",
                        "tertiary-fixed-dim": "#ffb596",
                        "tertiary-fixed": "#ffdbcd",
                        "tertiary-container": "#bc4800",
                        "surface-tint": "#b4c5ff",
                        "primary-fixed-dim": "#b4c5ff",
                        "error-container": "#93000a",
                        "primary": "#b4c5ff",
                        "on-primary-fixed-variant": "#003ea8",
                        "primary-container": "#2563eb",
                        "on-tertiary-fixed": "#360f00",
                        "on-tertiary-fixed-variant": "#7d2d00",
                        "on-error-container": "#ffdad6",
                        "background": "#11131b",
                        "inverse-on-surface": "#2e3039",
                        "primary-fixed": "#dbe1ff",
                        "error": "#ffb4ab",
                        "on-primary-fixed": "#00174b",
                        "secondary": "#b9c7e0",
                        "on-secondary-fixed": "#0d1c2f",
                        "inverse-primary": "#0053db"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "stack-md": "16px",
                        "container-padding-mobile": "20px",
                        "stack-lg": "24px",
                        "gutter": "16px",
                        "stack-sm": "8px",
                        "container-padding-desktop": "32px",
                        "base": "8px",
                        "section-gap": "40px"
                    },
                    "fontFamily": {
                        "numeric-display": [
                            "Inter"
                        ],
                        "display": [
                            "Inter"
                        ],
                        "headline-md": [
                            "Inter"
                        ],
                        "label-md": [
                            "Inter"
                        ],
                        "body-md": [
                            "Inter"
                        ],
                        "headline-lg-mobile": [
                            "Inter"
                        ],
                        "label-sm": [
                            "Inter"
                        ],
                        "body-lg": [
                            "Inter"
                        ],
                        "headline-lg": [
                            "Inter"
                        ]
                    },
                    "fontSize": {
                        "numeric-display": [
                            "36px",
                            {
                                "lineHeight": "44px",
                                "letterSpacing": "-0.02em",
                                "fontWeight": "500"
                            }
                        ],
                        "display": [
                            "40px",
                            {
                                "lineHeight": "48px",
                                "letterSpacing": "-0.02em",
                                "fontWeight": "600"
                            }
                        ],
                        "headline-md": [
                            "24px",
                            {
                                "lineHeight": "32px",
                                "fontWeight": "600"
                            }
                        ],
                        "label-md": [
                            "14px",
                            {
                                "lineHeight": "20px",
                                "letterSpacing": "0.01em",
                                "fontWeight": "500"
                            }
                        ],
                        "body-md": [
                            "16px",
                            {
                                "lineHeight": "24px",
                                "fontWeight": "400"
                            }
                        ],
                        "headline-lg-mobile": [
                            "24px",
                            {
                                "lineHeight": "32px",
                                "fontWeight": "600"
                            }
                        ],
                        "label-sm": [
                            "12px",
                            {
                                "lineHeight": "16px",
                                "letterSpacing": "0.02em",
                                "fontWeight": "500"
                            }
                        ],
                        "body-lg": [
                            "18px",
                            {
                                "lineHeight": "28px",
                                "fontWeight": "400"

                        "headline-lg": [

                    }
                },
            },
        }
    </script>
    <style>
        /* Custom scrollbar for webkit to match dark theme */
        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background-color: #32343d;
            /* surface-variant */
            border-radius: 4px;
        }

        /* Toggle Switch Styles */
        .toggle-checkbox:checked {
            right: 0;
            border-color: #b4c5ff;
            /* primary */
            background-color: #b4c5ff;
            /* primary */
        }

        .toggle-checkbox:checked+.toggle-label {
            background-color: #2563eb;
            /* primary-container */
        }

        .toggle-checkbox {
            right: 0;
            z-index: 1;
            border-color: #8d90a0;
            /* outline */
            transition: all 0.2s ease-in-out;
        }

        .toggle-label {
            background-color: #32343d;
            /* surface-variant */
            transition: all 0.2s ease-in-out;
        }

        /* Bottom Sheet Animation */
        @keyframes slideUp {
            from {
                transform: translateY(100%);
            }

            to {
                transform: translateY(0);
            }
        }

        .bottom-sheet-enter {
            animation: slideUp 0.3s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
        }
    </style>
    <style>
        body {
            min-height: max(884px, 100dvh);
        }
    </style>
</head>

<body class="bg-background text-on-background font-body-md h-screen w-screen overflow-hidden flex flex-col relative">
    <!-- Top Navigation Anchor (Background Context) -->
    <header
        class="w-full sticky top-0 z-10 bg-background flex items-center justify-between px-container-padding-mobile h-16 w-full">
        <div class="flex items-center gap-4">
            <button
                class="w-10 h-10 rounded-full bg-surface-container-high flex items-center justify-center text-on-surface hover:bg-surface-variant transition-colors duration-200">
                <span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">arrow_back</span>
            </button>
        </div>
        <div class="font-headline-md text-headline-md font-bold text-primary dark:text-primary">BudgetBuddy</div>
        <div class="w-10"></div> <!-- Spacer for balance -->
    </header>
    <!-- Simulated Background Content (To show modal overlay context) -->
    <main class="flex-1 overflow-y-auto px-container-padding-mobile py-stack-lg opacity-40 blur-sm pointer-events-none">
        <div class="space-y-stack-lg">
            <div class="h-32 bg-surface-container rounded-xl w-full"></div>
            <div class="h-24 bg-surface-container rounded-xl w-full"></div>
            <div class="h-48 bg-surface-container rounded-xl w-full"></div>
            <div class="h-24 bg-surface-container rounded-xl w-full"></div>
        </div>
    </main>
    <!-- Modal Overlay -->
    <div class="fixed inset-0 bg-surface-container-lowest/80 z-40 backdrop-blur-sm transition-opacity"
        id="modal-overlay"></div>
    <!-- Bottom Sheet Modal -->
    <div class="fixed bottom-0 left-0 w-full z-50 bg-surface-container-high rounded-t-3xl shadow-lg bottom-sheet-enter flex flex-col pb-safe max-h-[795px] md:w-[480px] md:left-1/2 md:-translate-x-1/2 md:rounded-3xl md:bottom-auto md:top-1/2 md:-translate-y-1/2"
        id="bottom-sheet">
        <!-- Drag Handle / Visual Anchor -->
        <div class="w-full flex justify-center pt-stack-sm pb-stack-md md:hidden">
            <div class="w-12 h-1.5 bg-outline-variant rounded-full"></div>
        </div>
        <div class="px-container-padding-mobile md:pt-container-padding-desktop pb-stack-md overflow-y-auto">
            <!-- Header Section -->
            <div class="mb-stack-lg flex justify-between items-start">
                <div>
                    <h2 class="font-headline-md text-headline-md text-on-surface mb-stack-sm">Configurar Notificação
                    </h2>
                    <p class="font-body-md text-body-md text-on-surface-variant">Personalize como você recebe alertas
                        para esta categoria.</p>
                </div>
                <button
                    class="w-10 h-10 flex items-center justify-center rounded-full text-on-surface-variant hover:bg-surface-variant transition-colors md:hidden"
                    id="close-modal-btn">
                    <span class="material-symbols-outlined">close</span>
                </button>
            </div>
            <!-- Settings List -->
            <div class="space-y-stack-md">
                <!-- Main Toggle: Silence -->
                <div
                    class="bg-surface rounded-xl p-stack-md flex items-center justify-between group hover:bg-surface-bright transition-colors border border-transparent hover:border-surface-variant">
                    <div class="pr-stack-md flex-1">
                        <div class="flex items-center gap-3 mb-1">
                            <div
                                class="w-8 h-8 rounded-full bg-secondary-container/30 flex items-center justify-center text-primary">
                                <span class="material-symbols-outlined text-[20px]"
                                    style="font-variation-settings: 'FILL' 1;">volume_off</span>
                            </div>
                            <span class="font-label-md text-label-md text-on-surface">Silenciar notificação</span>
                        </div>
                        <p class="font-label-sm text-label-sm text-on-surface-variant pl-11">Desativa sons e vibrações
                            para este alerta.</p>
                    </div>
                    <!-- Custom Toggle -->
                    <div
                        class="relative inline-block w-12 mr-2 align-middle select-none transition duration-200 ease-in flex-shrink-0">
                        <input
                            class="toggle-checkbox absolute block w-6 h-6 rounded-full bg-surface-variant border-2 border-outline-variant appearance-none cursor-pointer translate-x-0 checked:translate-x-6 checked:border-primary checked:bg-primary"
                            id="toggle-silence" name="toggle-silence" type="checkbox" />
                        <label
                            class="toggle-label block overflow-hidden h-6 rounded-full bg-surface-variant cursor-pointer border border-outline-variant"
                            for="toggle-silence"></label>
                    </div>
                </div>
                <!-- Delivery Methods Section -->
                <div class="pt-stack-md">
                    <h3
                        class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-wider mb-stack-sm px-2">
                        Métodos de Entrega</h3>
                    <div
                        class="bg-surface rounded-xl overflow-hidden divide-y divide-surface-variant border border-surface-variant">
                        <!-- Push Notification (Enabled by default) -->
                        <div
                            class="p-stack-md flex items-center justify-between hover:bg-surface-bright transition-colors">
                            <div class="flex items-center gap-3">
                                <div
                                    class="w-8 h-8 rounded-full bg-primary-container/20 flex items-center justify-center text-primary">
                                    <span class="material-symbols-outlined text-[20px]">notifications_active</span>
                                </div>
                                <span class="font-body-md text-body-md text-on-surface">Push Notification</span>
                            </div>
                            <!-- Custom Toggle (Checked) -->
                            <div
                                class="relative inline-block w-12 mr-2 align-middle select-none transition duration-200 ease-in flex-shrink-0">
                                <input checked=""
                                    class="toggle-checkbox absolute block w-6 h-6 rounded-full bg-primary border-2 border-primary appearance-none cursor-pointer translate-x-6"
                                    id="toggle-push" name="toggle-push" type="checkbox" />
                                <label
                                    class="toggle-label block overflow-hidden h-6 rounded-full bg-primary-container cursor-pointer border border-transparent"
                                    for="toggle-push"></label>
                            </div>
                        </div>
                        <!-- Email (Disabled by default) -->
                        <div
                            class="p-stack-md flex items-center justify-between hover:bg-surface-bright transition-colors">
                            <div class="flex items-center gap-3">
                                <div
                                    class="w-8 h-8 rounded-full bg-secondary-container/20 flex items-center justify-center text-on-surface-variant">
                                    <span class="material-symbols-outlined text-[20px]">mail</span>
                                </div>
                                <span class="font-body-md text-body-md text-on-surface">E-mail</span>
                            </div>
                            <!-- Custom Toggle (Unchecked) -->
                            <div
                                class="relative inline-block w-12 mr-2 align-middle select-none transition duration-200 ease-in flex-shrink-0">
                                <input
                                    class="toggle-checkbox absolute block w-6 h-6 rounded-full bg-surface-variant border-2 border-outline-variant appearance-none cursor-pointer translate-x-0"
                                    id="toggle-email" name="toggle-email" type="checkbox" />
                                <label
                                    class="toggle-label block overflow-hidden h-6 rounded-full bg-surface-variant cursor-pointer border border-outline-variant"
                                    for="toggle-email"></label>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <!-- Action Buttons -->
            <div class="mt-stack-lg pt-stack-md flex flex-col gap-stack-sm md:flex-row-reverse md:gap-gutter">
                <button
                    class="w-full md:w-auto flex-1 h-14 bg-primary text-on-primary font-label-md text-label-md font-semibold rounded-xl flex items-center justify-center hover:bg-primary-fixed transition-colors">
                    Salvar
                </button>
                <button
                    class="w-full md:w-auto flex-1 h-14 bg-transparent text-primary font-label-md text-label-md font-semibold rounded-xl flex items-center justify-center hover:bg-surface-variant transition-colors"
                    id="cancel-btn">
                    Cancelar
                </button>
            </div>
        </div>
        <!-- Safe Area Padding for iOS -->
        <div class="h-6 md:hidden"></div>
    </div>
    <!-- Navigation Shell Mapping (BottomNavBar - Contextual Anchor) -->
    <!-- Suppressed: The UX Goal states "If the user is in a focused journey or a 'dead end' relative to the global nav, hide the shell to prioritize the Canvas." -->
    <!-- A settings modal is a task-focused sub-page that implies a temporary departure, thus navigation is suppressed. -->
</body>

</html>
