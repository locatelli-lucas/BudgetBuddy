<!DOCTYPE html>
<html class="dark" lang="pt-BR">

<head>
    <meta charset="utf-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>Dados Pessoais</title>
    <!-- Material Symbols -->
    <link

        rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
        rel="stylesheet">
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {

                        "surface": "#11131b",

                        "inverse-on-surface": "#2e3039",
                        "on-secondary-fixed": "#0d1c2f",
                        "primary": "#b4c5ff",
                        "surface-container-low": "#191b23",
                        "surface-bright": "#373942",
                        "inverse-primary": "#0053db",
                        "on-tertiary-fixed-variant": "#7d2d00",
                        "on-secondary-container": "#abb9d2",
                        "on-surface": "#e1e2ed",
                        "secondary-container": "#3c4a5e",
                        "on-secondary": "#233144",
                        "tertiary-fixed": "#ffdbcd",
                        "surface-container-highest": "#32343d",
                        "error": "#ffb4ab",
                        "surface-container": "#1d1f27",
                        "on-primary": "#002a78",
                        "on-background": "#e1e2ed",
                        "secondary-fixed-dim": "#b9c7e0",
                        "primary-fixed-dim": "#b4c5ff",
                        "tertiary-fixed-dim": "#ffb596",
                        "on-tertiary": "#581e00",
                        "inverse-surface": "#e1e2ed",
                        "outline-variant": "#434655",
                        "on-secondary-fixed-variant": "#3a485c",
                        "primary-fixed": "#dbe1ff",
                        "on-primary-fixed": "#00174b",
                        "on-error": "#690005",
                        "secondary": "#b9c7e0",
                        "on-primary-fixed-variant": "#003ea8",
                        "surface-tint": "#b4c5ff",
                        "on-tertiary-fixed": "#360f00",

    <style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }

        .material-symbols-outlined.fill {
            font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }

        /* Hide scrollbar for clean look */
        ::-webkit-scrollbar {
            display: none;
        }

        body {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>

<body class="text-on-background font-body-md min-h-screen flex flex-col pb-[90px] bg-surface">
    <!-- Shared Component: TopAppBar -->
    <header class="bg-background w-full top-0 sticky flex items-center justify-between px-gutter py-stack-md z-40">
        <button
            class="text-on-surface-variant hover:bg-surface-variant transition-colors rounded-full p-2 active:opacity-80 transition-opacity flex items-center justify-center">
            <span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
        </button>
        <h1 class="font-headline-md text-headline-md font-bold text-primary">BudgetBuddy</h1>
        <button
            class="text-on-surface-variant hover:bg-surface-variant transition-colors rounded-full p-2 active:opacity-80 transition-opacity flex items-center justify-center">
            <span class="material-symbols-outlined" data-icon="notifications">notifications</span>
        </button>
    </header>
    <!-- Main Content -->
    <main
        class="flex-1 px-container-padding-mobile md:px-container-padding-desktop flex flex-col gap-stack-lg max-w-2xl mx-auto w-full mt-4">
        <!-- Screen Title -->
        <div class="flex flex-col gap-stack-sm">
            <h2
                class="font-headline-lg-mobile text-headline-lg-mobile md:font-headline-lg md:text-headline-lg text-on-background">
                Dados Pessoais</h2>
            <p class="font-body-md text-body-md text-on-surface-variant">Gerencie suas informações de perfil e contato.
            </p>
        </div>
        <!-- Profile Avatar Edit -->
        <div class="flex justify-center py-stack-md">
            <div class="relative inline-block">
                <div
                    class="w-28 h-28 rounded-full overflow-hidden border-4 border-surface-container-highest shadow-lg relative group cursor-pointer">
                    <div
                        class="absolute inset-0 bg-black/40 flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity z-10">
                        <span class="material-symbols-outlined text-white">photo_camera</span>
                    </div>
                    <div class="w-full h-full bg-surface-variant bg-cover bg-center"
                        data-alt="A high-quality, professional headshot of a modern young man named Lucas. He has short dark hair, a subtle beard, and is wearing a dark, premium minimal t-shirt. The background is a clean, dark slate studio setting with subtle cinematic edge lighting. The overall tone is confident, modern, and aligned with a premium digital banking aesthetic."
                        style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuCuFjZR3BZh57rTDK2LuoUcKikYK8Cbvdh7wd9FrbhnRAa7f4r1dZjyGiEHJ3lGa1oPBsQV9fiGCdkViAH7RIX_RIUPZ4MPBIj0haEwKzqqlaxEzlL1ZfGryiFTFq1OE0nIWIkUa1RhFzc9g1wHCjFB_MsGoGwHjfOVqC-6sHWeYlIHUL_fW58K-zCM4gwEI47znvyiQ9Rn5xYmLlJsn7I8uqI4ifdPj5rElDkWhubjj2w8cwlOG9VlEqqZ-oJDPB8LlEX80RmIniI');">
                    </div>
                </div>
                <button
                    class="absolute bottom-0 right-0 w-10 h-10 bg-primary-container text-on-primary-container rounded-full flex items-center justify-center border-4 border-background shadow-md hover:bg-primary transition-colors active:scale-95">
                    <span class="material-symbols-outlined text-[20px]" data-icon="edit">edit</span>
                </button>
            </div>
        </div>
        <!-- Form Fields (Tonal Glassmorphism style) -->
        <form class="flex flex-col gap-stack-md mt-4" onsubmit="event.preventDefault();">
            <div class="flex flex-col gap-base">
                <label class="font-label-md text-label-md text-on-surface-variant pl-1">Nome Completo</label>
                <div
                    class="relative flex items-center bg-surface-container-high rounded-xl overflow-hidden focus-within:ring-2 focus-within:ring-primary transition-shadow">
                    <div class="pl-4 pr-2 text-on-surface-variant flex items-center">
                        <span class="material-symbols-outlined text-[20px]" data-icon="person">person</span>
                    </div>
                    <input
                        class="w-full bg-transparent border-none text-on-surface font-body-md text-body-md py-4 pr-4 focus:ring-0"
                        placeholder="Seu nome completo" type="text" value="Lucas Silva">
                </div>
            </div>
            <div class="flex flex-col gap-base">
                <label class="font-label-md text-label-md text-on-surface-variant pl-1">E-mail</label>
                <div
                    class="relative flex items-center bg-surface-container-high rounded-xl overflow-hidden focus-within:ring-2 focus-within:ring-primary transition-shadow">
                    <div class="pl-4 pr-2 text-on-surface-variant flex items-center">
                        <span class="material-symbols-outlined text-[20px]" data-icon="mail">mail</span>
                    </div>
                    <input
                        class="w-full bg-transparent border-none text-on-surface font-body-md text-body-md py-4 pr-4 focus:ring-0"
                        placeholder="seu.email@exemplo.com" type="email" value="lucas.silva@email.com">
                </div>
            </div>
            <div class="flex flex-col gap-base">
                <label class="font-label-md text-label-md text-on-surface-variant pl-1">Número de Telefone</label>
                <div
                    class="relative flex items-center bg-surface-container-high rounded-xl overflow-hidden focus-within:ring-2 focus-within:ring-primary transition-shadow">
                    <div class="pl-4 pr-2 text-on-surface-variant flex items-center">
                        <span class="material-symbols-outlined text-[20px]" data-icon="phone_iphone">phone_iphone</span>
                    </div>
                    <input
                        class="w-full bg-transparent border-none text-on-surface font-body-md text-body-md py-4 pr-4 focus:ring-0"
                        placeholder="+55 (00) 00000-0000" type="tel" value="+55 11 99999-9999">
                </div>
            </div>
            <div class="flex flex-col gap-base">
                <label class="font-label-md text-label-md text-on-surface-variant pl-1">Data de Nascimento</label>
                <div
                    class="relative flex items-center bg-surface-container-high rounded-xl overflow-hidden focus-within:ring-2 focus-within:ring-primary transition-shadow">
                    <div class="pl-4 pr-2 text-on-surface-variant flex items-center">
                        <span class="material-symbols-outlined text-[20px]"
                            data-icon="calendar_today">calendar_today</span>
                    </div>
                    <input
                        class="w-full bg-transparent border-none text-on-surface font-body-md text-body-md py-4 pr-4 focus:ring-0"
                        placeholder="DD/MM/AAAA" type="text" value="15/08/1992">
                </div>
            </div>
            <div class="mt-section-gap">
                <button
                    class="w-full bg-primary hover:bg-primary-container text-on-primary font-label-md text-label-md font-bold py-4 rounded-full transition-colors shadow-[0_4px_14px_rgba(37,99,235,0.3)] active:scale-[0.98] transform flex justify-center items-center gap-2 min-h-[56px]"
                    type="submit">
                    <span class="material-symbols-outlined" data-icon="save">save</span>
                    Salvar Alterações
                </button>
            </div>
        </form>
    </main>
    <!-- Shared Component: BottomNavBar -->
    <nav
        class="bg-surface-container fixed bottom-0 w-full z-50 rounded-t-xl shadow-[0_-4px_12px_rgba(0,0,0,0.2)] flex justify-around items-center h-[72px] px-2 pb-safe w-full md:hidden">
        <!-- Inactive -->
        <a class="flex flex-col items-center justify-center text-on-surface-variant hover:text-primary transition-all scale-95 active:scale-90 transition-transform w-[64px]"
            href="#">
            <span class="material-symbols-outlined mb-1" data-icon="home">home</span>
            <span class="font-label-sm text-label-sm">Início</span>
        </a>
        <!-- Inactive -->
        <a class="flex flex-col items-center justify-center text-on-surface-variant hover:text-primary transition-all scale-95 active:scale-90 transition-transform w-[64px]"
            href="#">
            <span class="material-symbols-outlined mb-1"
                data-icon="account_balance_wallet">account_balance_wallet</span>
            <span class="font-label-sm text-label-sm">Transações</span>
        </a>
        <!-- Inactive -->
        <a class="flex flex-col items-center justify-center text-on-surface-variant hover:text-primary transition-all scale-95 active:scale-90 transition-transform w-[64px]"
            href="#">
            <span class="material-symbols-outlined mb-1" data-icon="pie_chart">pie_chart</span>
            <span class="font-label-sm text-label-sm">Orçamentos</span>
        </a>
        <!-- Inactive -->
        <a class="flex flex-col items-center justify-center text-on-surface-variant hover:text-primary transition-all scale-95 active:scale-90 transition-transform w-[64px]"
            href="#">
            <span class="material-symbols-outlined mb-1" data-icon="trending_up">trending_up</span>
            <span class="font-label-sm text-label-sm">Investir</span>
        </a>
        <!-- Active ('Perfil') -->
        <a class="flex flex-col items-center justify-center bg-secondary-container text-on-secondary-container rounded-full px-4 py-1 scale-95 active:scale-90 transition-transform"
            href="#">
            <span class="material-symbols-outlined fill mb-1" data-icon="person" data-weight="fill">person</span>
            <span class="font-label-sm text-label-sm font-bold">Perfil</span>
        </a>
    </nav>




</body>

</html>
