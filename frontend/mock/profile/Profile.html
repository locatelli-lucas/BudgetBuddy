<!DOCTYPE html>
<html class="dark" lang="en">

<head>
    <meta charset="utf-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>BudgetBuddy - Profile</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
        rel="stylesheet">
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
        rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&amp;display=swap" rel="stylesheet">
    <style>
        .material-symbols-outlined {
            font-family: 'Material Symbols Outlined';
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }

        [data-weight="fill"] {
            font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }

        /* Safe area fallback for mobile */
        .pb-safe {
            padding-bottom: env(safe-area-inset-bottom, 20px);
        }
    </style>
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-tertiary-container": "#ffede6",
                        "error-container": "#93000a",
                        "surface-container-low": "#191b23",
                        "on-secondary-fixed": "#0d1c2f",
                        "on-secondary-container": "#abb9d2",
                        "inverse-on-surface": "#2e3039",
                        "surface-bright": "#373942",
                        "surface-container-high": "#282a32",
                        "secondary-fixed-dim": "#b9c7e0",
                        "on-error-container": "#ffdad6",
                        "secondary-container": "#3c4a5e",
                        "on-primary-fixed": "#00174b",
                        "on-primary-container": "#eeefff",
                        "on-surface": "#e1e2ed",
                        "surface-container-highest": "#32343d",
                        "surface-container-lowest": "#0c0e16",
                        "on-primary": "#002a78",
                        "on-secondary-fixed-variant": "#3a485c",
                        "background": "#11131b",
                        "tertiary-fixed": "#ffdbcd",
                        "surface-container": "#1d1f27",
                        "tertiary-fixed-dim": "#ffb596",
                        "primary-fixed": "#dbe1ff",
                        "primary-container": "#2563eb",
                        "on-secondary": "#233144",
                        "tertiary": "#ffb596",
                        "on-surface-variant": "#c3c6d7",
                        "on-error": "#690005",
                        "surface-tint": "#b4c5ff",
                        "on-tertiary-fixed": "#360f00",
                        "on-tertiary": "#581e00",
                        "primary-fixed-dim": "#b4c5ff",
                        "primary": "#b4c5ff",
                        "tertiary-container": "#bc4800",
                        "outline": "#8d90a0",
                        "surface-dim": "#11131b",
                        "on-tertiary-fixed-variant": "#7d2d00",
                        "error": "#ffb4ab",
                        "on-background": "#e1e2ed",
                        "secondary": "#b9c7e0",
                        "surface": "#11131b",
                        "secondary-fixed": "#d5e3fd",
                        "inverse-surface": "#e1e2ed",
                        "on-primary-fixed-variant": "#003ea8",
                        "surface-variant": "#32343d",
                        "outline-variant": "#434655",
                        "inverse-primary": "#0053db"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "stack-lg": "24px",
                        "section-gap": "40px",
                        "stack-sm": "8px",
                        "stack-md": "16px",
                        "gutter": "16px",
                        "container-padding-mobile": "20px",
                        "container-padding-desktop": "32px",
                        "base": "8px"
                    },
                    "fontFamily": {
                        "body-md": ["Inter"],
                        "headline-lg": ["Inter"],
                        "label-md": ["Inter"],
                        "display": ["Inter"],
                        "label-sm": ["Inter"],
                        "headline-md": ["Inter"],
                        "headline-lg-mobile": ["Inter"],
                        "numeric-display": ["Inter"],
                        "body-lg": ["Inter"]
                    },
                    "fontSize": {
                        "body-md": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "headline-lg": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.01em", "fontWeight": "600" }],
                        "label-md": ["14px", { "lineHeight": "20px", "letterSpacing": "0.01em", "fontWeight": "500" }],
                        "display": ["40px", { "lineHeight": "48px", "letterSpacing": "-0.02em", "fontWeight": "600" }],
                        "label-sm": ["12px", { "lineHeight": "16px", "letterSpacing": "0.02em", "fontWeight": "500" }],
                        "headline-md": ["24px", { "lineHeight": "32px", "fontWeight": "600" }],
                        "headline-lg-mobile": ["24px", { "lineHeight": "32px", "fontWeight": "600" }],
                        "numeric-display": ["36px", { "lineHeight": "44px", "letterSpacing": "-0.02em", "fontWeight": "500" }],
                        "body-lg": ["18px", { "lineHeight": "28px", "fontWeight": "400" }]
                    }
                }
            }
        }
    </script>
    <style>
        body {
            min-height: max(884px, 100dvh);
        }
    </style>
</head>

<body
    class="text-on-background font-body-md min-h-screen flex flex-col selection:bg-primary-container selection:text-on-primary-container bg-surface w-full">
    <!-- TopAppBar -->
    <header
        class="flex items-center justify-between px-container-padding-mobile h-16 w-full sticky top-0 z-40 bg-surface dark:bg-surface">
        <div class="flex items-center gap-4">
            <button
                class="text-on-surface-variant dark:text-on-surface-variant hover:opacity-80 transition-opacity active:scale-95 flex items-center justify-center p-2 -ml-2 rounded-full">
                <span class="material-symbols-outlined" data-icon="menu">menu</span>
            </button>
            <h1 class="font-headline-md text-headline-md font-bold text-primary dark:text-primary tracking-tight">
                BudgetBuddy</h1>
        </div>
        <button
            class="text-on-surface-variant dark:text-on-surface-variant hover:opacity-80 transition-opacity active:scale-95 flex items-center justify-center p-2 -mr-2 rounded-full relative">
            <span class="material-symbols-outlined" data-icon="notifications">notifications</span>
            <span class="absolute top-2 right-2 w-2 h-2 bg-error rounded-full border border-background"></span>
        </button>
    </header>
    <!-- Main Content Canvas -->
    <main class="flex-1 px-container-padding-mobile flex flex-col gap-section-gap pb-32 pt-4 w-full">
        <!-- Profile Header -->
        <section class="flex flex-col items-center gap-stack-md animate-[fadeIn_0.5s_ease-out]">
            <div class="relative group">
                <div class="w-28 h-28 rounded-full border-2 border-primary/20 p-1 relative z-10 bg-surface">
                    <img alt="Lucas Profile Photo" class="w-full h-full rounded-full object-cover"
                        data-alt="A highly professional, well-lit headshot of a young, modern individual with a confident and subtle smile. The background is completely isolated in a deep, moody navy tone that perfectly complements a dark mode fintech interface. The lighting is soft and cinematic, emphasizing an atmosphere of trust, precision, and premium digital banking."
                        src="https://lh3.googleusercontent.com/aida-public/AB6AXuA7QvSpKRonxYBJWsc4taDK9UegIDclmavx_htpqWPU-_uirdkMlI1zBS2XiASORqpO0_sZpVuJouw7yy5Pc4nMODioXLPMMPf821jw62R-yxcrsrZGdBL7jE7iWJ5vx-0iKIh55W4JllZi6xRT4fUyyclPwnS3EPprnEBn7UZ-OVJIz1kKcJRT6JLQuSxKycMLVDRcfPc0sjbu4a0MCESLpN8l1mZIHcYOE0fTJTbmQdNOvWKCvBAck7h3TATbM9RJBq6EKS2OstI">
                </div>
                <button
                    class="absolute bottom-0 right-0 z-20 bg-primary text-on-primary w-8 h-8 rounded-full flex items-center justify-center shadow-md border-2 border-background hover:scale-105 transition-transform">
                    <span class="material-symbols-outlined text-[16px]" data-icon="edit">edit</span>
                </button>
            </div>
            <div class="flex flex-col items-center text-center">
                <h2 class="font-headline-lg-mobile text-headline-lg-mobile text-on-background">Lucas</h2>
                <div
                    class="mt-2 inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-tertiary-container/20 border border-tertiary-container/30">
                    <span class="material-symbols-outlined text-[16px] text-tertiary" data-icon="verified"
                        data-weight="fill">verified</span>
                    <span class="font-label-sm text-label-sm text-tertiary font-medium">Premium Member</span>
                </div>
            </div>
        </section>
        <!-- CTA: Upgrade to Gold -->
        <section
            class="bg-surface-variant/40 rounded-xl p-6 border border-tertiary/20 relative overflow-hidden group hover:border-tertiary/40 transition-colors">
            <div
                class="absolute -right-12 -top-12 w-40 h-40 bg-tertiary/10 rounded-full blur-3xl group-hover:bg-tertiary/20 transition-colors">
            </div>
            <div class="relative z-10 flex flex-col gap-4">
                <div class="flex items-start justify-between">
                    <div>
                        <h3 class="font-headline-md text-headline-md text-on-background flex items-center gap-2">
                            <span class="material-symbols-outlined text-tertiary" data-icon="stars"
                                data-weight="fill">stars</span>
                            Upgrade to Gold
                        </h3>
                        <p class="font-body-md text-body-md text-on-surface-variant mt-1 max-w-[280px]">
                            Unlock zero-fee transfers, dedicated advisors, and advanced wealth analytics.
                        </p>
                    </div>
                </div>
                <button
                    class="bg-tertiary text-on-tertiary font-label-md text-label-md py-3.5 px-6 rounded-lg w-full flex items-center justify-center gap-2 hover:opacity-90 active:scale-[0.98] transition-all shadow-[0_4px_12px_rgba(255,181,150,0.15)] mt-2">
                    Explore Gold Benefits
                    <span class="material-symbols-outlined text-[18px]" data-icon="arrow_forward">arrow_forward</span>
                </button>
            </div>
        </section>
        <!-- Settings Groups (Bento-style list cards) -->
        <section class="flex flex-col gap-stack-lg">
            <!-- Group: Conta -->
            <div class="flex flex-col gap-stack-sm">
                <h4 class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-wider px-2">Conta</h4>
                <div
                    class="bg-surface rounded-xl flex flex-col border border-outline-variant/30 overflow-hidden shadow-sm shadow-black/20">
                    <button
                        class="flex items-center justify-between p-4 w-full hover:bg-surface-variant/50 transition-colors border-b border-outline-variant/20 active:bg-surface-variant group">
                        <div class="flex items-center gap-4">
                            <div
                                class="w-10 h-10 rounded-full bg-secondary-container/40 flex items-center justify-center text-primary group-hover:bg-primary-container group-hover:text-on-primary-container transition-colors">
                                <span class="material-symbols-outlined" data-icon="badge">badge</span>
                            </div>
                            <span class="font-body-md text-body-md text-on-surface font-medium">Dados pessoais</span>
                        </div>
                        <span class="material-symbols-outlined text-on-surface-variant"
                            data-icon="chevron_right">chevron_right</span>
                    </button>
                    <button
                        class="flex items-center justify-between p-4 w-full hover:bg-surface-variant/50 transition-colors active:bg-surface-variant group">
                        <div class="flex items-center gap-4">
                            <div
                                class="w-10 h-10 rounded-full bg-secondary-container/40 flex items-center justify-center text-primary group-hover:bg-primary-container group-hover:text-on-primary-container transition-colors">
                                <span class="material-symbols-outlined" data-icon="security">security</span>
                            </div>
                            <span class="font-body-md text-body-md text-on-surface font-medium">Segurança</span>
                        </div>
                        <span class="material-symbols-outlined text-on-surface-variant"
                            data-icon="chevron_right">chevron_right</span>
                    </button>
                </div>
            </div>
            <!-- Group: Preferências -->
            <div class="flex flex-col gap-stack-sm">
                <h4 class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-wider px-2">
                    Preferências</h4>
                <div
                    class="bg-surface rounded-xl flex flex-col border border-outline-variant/30 overflow-hidden shadow-sm shadow-black/20">
                    <button
                        class="flex items-center justify-between p-4 w-full hover:bg-surface-variant/50 transition-colors border-b border-outline-variant/20 active:bg-surface-variant group">
                        <div class="flex items-center gap-4">
                            <div
                                class="w-10 h-10 rounded-full bg-secondary-container/40 flex items-center justify-center text-primary group-hover:bg-primary-container group-hover:text-on-primary-container transition-colors">
                                <span class="material-symbols-outlined"
                                    data-icon="notifications_active">notifications_active</span>
                            </div>
                            <span class="font-body-md text-body-md text-on-surface font-medium">Notificações</span>
                        </div>
                        <span class="material-symbols-outlined text-on-surface-variant"
                            data-icon="chevron_right">chevron_right</span>
                    </button>
                    <button
                        class="flex items-center justify-between p-4 w-full hover:bg-surface-variant/50 transition-colors active:bg-surface-variant group">
                        <div class="flex items-center gap-4">
                            <div
                                class="w-10 h-10 rounded-full bg-secondary-container/40 flex items-center justify-center text-primary group-hover:bg-primary-container group-hover:text-on-primary-container transition-colors">
                                <span class="material-symbols-outlined" data-icon="palette">palette</span>
                            </div>
                            <span class="font-body-md text-body-md text-on-surface font-medium">Aparência</span>
                        </div>
                        <span class="material-symbols-outlined text-on-surface-variant"
                            data-icon="chevron_right">chevron_right</span>
                    </button>
                </div>
            </div>
            <!-- Group: Outros -->
            <div class="flex flex-col gap-stack-sm">
                <h4 class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-wider px-2">Outros
                </h4>
                <div
                    class="bg-surface rounded-xl flex flex-col border border-outline-variant/30 overflow-hidden shadow-sm shadow-black/20">

                    <button
                        class="flex items-center justify-between p-4 w-full hover:bg-error-container/10 transition-colors active:bg-error-container/20 group">
                        <div class="flex items-center gap-4">
                            <div
                                class="w-10 h-10 rounded-full bg-error-container/20 flex items-center justify-center text-error group-hover:bg-error-container transition-colors">
                                <span class="material-symbols-outlined" data-icon="logout">logout</span>
                            </div>
                            <span class="font-body-md text-body-md text-error font-medium">Sair</span>
                        </div>
                    </button>
                </div>
            </div>
        </section>
        <!-- Version Info -->
        <div class="text-center mt-4">
            <span class="font-label-sm text-label-sm text-on-surface-variant/50">BudgetBuddy v2.4.1</span>
        </div>
    </main>
    <!-- BottomNavBar -->
    <nav
        class="bg-surface-container dark:bg-surface-container border-t border-outline-variant/30 shadow-[0_-4px_16px_rgba(0,0,0,0.3)] fixed bottom-0 w-full z-50 flex justify-around items-center px-4 py-3 pb-safe">
        <!-- In�cio -->
        <button
            class="flex flex-col items-center justify-center text-on-surface-variant dark:text-on-surface-variant hover:text-primary dark:hover:text-primary active:scale-90 transition-transform w-16">
            <span class="material-symbols-outlined" data-icon="home">home</span>
            <span class="font-label-sm text-label-sm mt-1">Incio</span>
        </button>
        <!-- Transa��es -->
        <button
            class="flex flex-col items-center justify-center text-on-surface-variant dark:text-on-surface-variant hover:text-primary dark:hover:text-primary active:scale-90 transition-transform w-16">
            <span class="material-symbols-outlined" data-icon="receipt_long">receipt_long</span>
            <span class="font-label-sm text-label-sm mt-1">Transaes</span>
        </button>
        <!-- Or�amentos -->
        <button
            class="flex flex-col items-center justify-center text-on-surface-variant dark:text-on-surface-variant hover:text-primary dark:hover:text-primary active:scale-90 transition-transform w-16">
            <span class="material-symbols-outlined" data-icon="account_balance_wallet">account_balance_wallet</span>
            <span class="font-label-sm text-label-sm mt-1">Oramentos</span>
        </button>
        <!-- Investir -->
        <button
            class="flex flex-col items-center justify-center text-on-surface-variant dark:text-on-surface-variant hover:text-primary dark:hover:text-primary active:scale-90 transition-transform w-16">
            <span class="material-symbols-outlined" data-icon="trending_up">trending_up</span>
            <span class="font-label-sm text-label-sm mt-1">Investir</span>
        </button>
        <!-- Perfil (Active) -->
        <button
            class="flex flex-col items-center justify-center bg-secondary-container dark:bg-secondary-container text-on-secondary-container dark:text-on-secondary-container rounded-full px-4 py-1 active:scale-90 transition-transform min-w-[64px]">
            <span class="material-symbols-outlined" data-icon="person" data-weight="fill">person</span>
            <span class="font-label-sm text-label-sm mt-1 font-bold">Perfil</span>
        </button>
    </nav>












</body>

</html>
