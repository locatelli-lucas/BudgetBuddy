    <style>
        body {
            background-color: #11131b;

<body class="text-on-surface antialiased font-body-md min-h-screen flex flex-col bg-surface">
    <!-- TopAppBar -->
    <header class="w-full sticky top-0 flex items-center h-16 px-4 z-40 bg-surface dark:bg-surface">
        <button aria-label="Voltar"
            class="text-primary dark:text-primary active:scale-95 transition-transform hover:opacity-80 transition-opacity p-2 -ml-2 rounded-full">
            <span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
        </button>
        <h1 class="ml-2 font-headline-md text-headline-md text-primary dark:text-primary truncate">Alterar Senha</h1>
    </header>
    <!-- Main Content -->
    <main
        class="flex-grow px-container-padding-mobile md:px-container-padding-desktop pb-32 pt-stack-md flex flex-col max-w-2xl mx-auto w-full">
        <p class="font-body-md text-body-md text-on-surface-variant mb-stack-lg">
            Sua senha deve ter pelo menos 8 caracteres, incluindo letras e números.
        </p>
        <form class="flex flex-col gap-stack-md">
            <!-- Current Password -->
            <div class="flex flex-col gap-stack-sm relative">
                <label class="font-label-md text-label-md text-on-surface" for="current-password">Senha Atual</label>
                <div class="relative">
                    <input
                        class="w-full bg-surface-variant text-on-surface rounded-lg px-4 py-3 border border-transparent focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-colors pr-12 font-body-md text-body-md placeholder-outline"
                        id="current-password" placeholder="Insira a senha atual" type="password">
                    <button aria-label="Alternar visibilidade"
                        class="absolute right-3 top-1/2 -translate-y-1/2 text-on-surface-variant hover:text-primary transition-colors p-1"
                        type="button">
                        <span class="material-symbols-outlined" data-icon="visibility_off">visibility_off</span>
                    </button>
                </div>
            </div>
            <!-- New Password -->
            <div class="flex flex-col gap-stack-sm relative">
                <label class="font-label-md text-label-md text-on-surface" for="new-password">Nova Senha</label>
                <div class="relative">
                    <input
                        class="w-full bg-surface-variant text-on-surface rounded-lg px-4 py-3 border border-transparent focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-colors pr-12 font-body-md text-body-md placeholder-outline"
                        id="new-password" placeholder="Insira a nova senha" type="password">
                    <button aria-label="Alternar visibilidade"
                        class="absolute right-3 top-1/2 -translate-y-1/2 text-on-surface-variant hover:text-primary transition-colors p-1"
                        type="button">
                        <span class="material-symbols-outlined" data-icon="visibility_off">visibility_off</span>
                    </button>
                </div>
            </div>
            <!-- Confirm New Password -->
            <div class="flex flex-col gap-stack-sm relative mb-stack-lg">
                <label class="font-label-md text-label-md text-on-surface" for="confirm-password">Confirmar Nova
                    Senha</label>
                <div class="relative">
                    <input
                        class="w-full bg-surface-variant text-on-surface rounded-lg px-4 py-3 border border-transparent focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-colors pr-12 font-body-md text-body-md placeholder-outline"
                        id="confirm-password" placeholder="Repita a nova senha" type="password">
                    <button aria-label="Alternar visibilidade"
                        class="absolute right-3 top-1/2 -translate-y-1/2 text-on-surface-variant hover:text-primary transition-colors p-1"
                        type="button">
                        <span class="material-symbols-outlined" data-icon="visibility_off">visibility_off</span>
                    </button>
                </div>
            </div>
            <!-- Action Button -->
            <button
                class="mt-auto md:mt-0 w-full h-[56px] bg-primary text-on-primary font-headline-md text-headline-md text-base font-semibold rounded-xl active:scale-[0.98] transition-transform flex items-center justify-center hover:opacity-90"
                type="button">
                Atualizar Senha
            </button>
        </form>
    </main>
    <!-- BottomNavBar (Suppressed intentionally as this is a sub-task, but included based on instructions to use standard 5-icon nav if required, opting to hide it structurally per semantic rules if this were a strict flow, but user requested standard 5-icon nav bar. Will render for literal compliance but keep it clean.) -->
    <!-- Note: Instruction "Footer: Standard 5-icon navigation bar." conflicts with generic "hide on sub-pages" rule. Executing literal request. -->
    <nav
        class="bg-surface-container dark:bg-surface-container fixed bottom-0 w-full z-50 shadow-[0_-4px_12px_rgba(0,0,0,0.2)] flex justify-around items-center h-20 px-4 pb-4 md:hidden">
        <button
            class="flex flex-col items-center justify-center text-on-surface-variant p-2 hover:bg-secondary-container/50 transition-colors active:scale-90 transition-transform rounded-xl">
            <span class="material-symbols-outlined text-2xl mb-1" data-icon="home">home</span>
        </button>
        <button
            class="flex flex-col items-center justify-center text-on-surface-variant p-2 hover:bg-secondary-container/50 transition-colors active:scale-90 transition-transform rounded-xl">
            <span class="material-symbols-outlined text-2xl mb-1"
                data-icon="account_balance_wallet">account_balance_wallet</span>
        </button>
        <button
            class="flex flex-col items-center justify-center text-on-surface-variant p-2 hover:bg-secondary-container/50 transition-colors active:scale-90 transition-transform rounded-xl">
            <span class="material-symbols-outlined text-2xl mb-1" data-icon="swap_horiz">swap_horiz</span>
        </button>
        <button
            class="flex flex-col items-center justify-center bg-primary-container text-on-primary-container rounded-xl p-2 active:scale-90 transition-transform">
            <span class="material-symbols-outlined text-2xl mb-1" data-icon="security"
                style="font-variation-settings: 'FILL' 1;">security</span>
        </button>
        <button
            class="flex flex-col items-center justify-center text-on-surface-variant p-2 hover:bg-secondary-container/50 transition-colors active:scale-90 transition-transform rounded-xl">
            <span class="material-symbols-outlined text-2xl mb-1" data-icon="person">person</span>
        </button>
    </nav>
    <script>
        // Simple visibility toggle script
        document.querySelectorAll('button[aria-label="Alternar visibilidade"]').forEach(button => {
            button.addEventListener('click', function () {
                const input = this.previousElementSibling;
                const icon = this.querySelector('span');
                if (input.type === 'password') {
                    input.type = 'text';
                    icon.textContent = 'visibility';
                    icon.setAttribute('data-icon', 'visibility');
                } else {
                    input.type = 'password';
                    icon.textContent = 'visibility_off';
                    icon.setAttribute('data-icon', 'visibility_off');
                }
            });
        });
    </script>


</body>

</html>
